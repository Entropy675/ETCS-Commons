<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ETCS Paint -- two canvases</title>
  <!-- Empty data: icon so the browser stops asking for /favicon.ico. The server
       holds exactly www/ plus three named mounts, so that request was always a
       404 -- and a permanent 404 in the console is noise a real one hides behind. -->
  <link rel="icon" href="data:,"/>
  <style>
    :root {
      /* Palette from chess.html (ACE Chess) so shell / window share the same surface. */
      --light: #e8e2d5; --dark: #7a8a6f; --sel: #c9b458; --ink: #1c1c1a;
      --bg: #14150f; --panel: #1b1c14; --line: #3b3d31; --dim: #8d907c;
      /* Aliases used by the existing rules */
      --border: var(--line);
      --fg: var(--light);
      --muted: var(--dim);
      --accent: var(--sel);
      --ok: #7a9a5a;
      --err: #c45c4a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body { overflow-y: auto; }

    /*
     * GRID, AND THE TERMINAL HAS A FLOOR.
     *
     * The canvas is 1024x768 and the terminal was whatever was left, which on a
     * laptop is about three lines -- unusable for the thing you actually type
     * into. So the canvas is the elastic one now and the terminal has a minimum:
     * 15rem stacked, which is 8 lines of 13px/1.45 text plus the shell page's own
     * header and input row. The canvas gives up space first because it can: it
     * scales, and its framebuffer is set by Create() regardless of display size.
     */
    #layout {
      display: grid; gap: 0.75rem; padding: 0.75rem;
      height: 100%; max-width: 1600px; margin: 0 auto;
      grid-template-columns: 1fr;
      /* Stacked: the terminal takes a clamped share (never under 15rem = 8 lines
         plus the shell page's own chrome, never more than 28rem) and the canvas
         takes ALL the rest, shrinking to fit rather than pushing the terminal off
         the bottom of the viewport. height:100% not min-height, so the two of
         them fit the screen instead of making the page scroll to reach the thing
         you type into. */
      grid-template-rows: auto minmax(0, 1fr) clamp(15rem, 40%, 28rem);
      grid-template-areas: "head" "stage" "term";
    }
    header {
      grid-area: head;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      color: var(--muted); font-size: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
      margin: -0.75rem -0.75rem 0;
    }
    header .brand {
      color: var(--accent); font-size: 14px; font-weight: bold;
      letter-spacing: .12em; text-decoration: none;
    }
    header .brand:hover { text-decoration: underline; }
    /* The two file controls, in the header because that is the one strip of
       the page that is not a canvas: the sheet is GLFW's and the toolbar is a
       node inside it, so a DOM control anywhere else would sit on something
       that is drawn. Styled as the terminal's chrome, not as the toolbar's
       slices -- they are the page's, and the page is monospace on --panel. */
    header .files { display: flex; align-items: center; gap: 8px; }
    header .files input[type=file] { display: none; }
    header .btn {
      color: var(--fg); background: transparent; border: 1px solid var(--line);
      border-radius: 4px; padding: 1px 10px; font: inherit; font-size: 12px;
      line-height: 1.5; cursor: pointer;
    }
    header .btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Centres the canvas in whatever box the grid gave it, and min-height:0 is
       what lets that box actually shrink -- a grid item defaults to min-content,
       which for a 768px-tall canvas means it never yields. */
    #stage {
      grid-area: stage; min-height: 0; min-width: 0;
      display: flex; align-items: center; justify-content: center;
    }
    /* The window's framebuffer. Create() resizes the ATTRIBUTES to whatever
       boot.etcs asked for; these rules only decide how big it is drawn, and
       width/height:auto against both maxima keeps the aspect ratio while
       fitting the box. */
    /* ASPECT IS STATED, not left to the intrinsic size.
       max-width/max-height with width/height:auto looks like it preserves the
       framebuffer's shape and does not: measured across the breakpoint this box
       came out 959x420 at one width and 632x768 at the next -- squashed one way,
       then the other, with the scale differing per axis by up to 1.8x.
       Two things went wrong with that. A point converted with one scale factor
       lands in the wrong place, and worse, a box taller than the row it sits in
       is CLIPPED -- and clipped content is not hit-testable, so controls near the
       bottom of the document simply stopped responding at some window sizes
       while the same controls worked at others.
       aspect-ratio pins the shape to the framebuffer's, and min-height:0 lets
       the box actually shrink to the row instead of overflowing it. */
    canvas#canvas {
      display: block; background: #0a0b08;
      border: 1px solid var(--border); border-radius: 6px;
      aspect-ratio: 1024 / 768;
      max-width: 100%; max-height: 100%;
      /* !important IS LOAD-BEARING HERE, and it is not a shortcut.
         emscripten's GLFW writes an INLINE style on the canvas it owns --
         style="width: 1024px; height: 768px" -- from adjustCanvasDimensions,
         and re-writes it on resize and on a device-pixel-ratio change. An
         inline declaration outranks a stylesheet one, so `width: auto` was
         being ignored: the measured box stayed 768 CSS tall whatever the row
         could give it, which is what clipped the bottom of the document and
         made controls there unreachable.
         Overriding it is the only way to keep the page's layout in charge of
         the box while GLFW stays in charge of the FRAMEBUFFER, which is the
         division that should hold: the framebuffer is the drawing surface's
         business, the box is the document's. */
      width: auto !important; height: auto !important;
      min-height: 0;
      box-shadow: -1px -1px 5px rgba(100, 0, 228, 0.7), 1px 1px 5px rgba(0, 0, 255, 0.7);
    }

    /* THE STRIP'S WRAPPER IS GONE, and so is the rule that placed it.
       The toolbar stopped being a second canvas -- it is a CompositeDrawable2D
       inside the sheet now (boot_paint_panels.etcs) -- but `#barwrap` kept
       `grid-area: bar` after `bar` was removed from both grid-template-areas.
       A named area that does not resolve is not ignored: the item is
       auto-placed instead, which ADDS implicit tracks. Measured, the grid
       reported five rows where three are declared
       (31.5px 0px 805.5px 0px 0px), so an empty div was costing two extra
       `gap`s of vertical space in a container that is height:100%. */

    /* SIDE BY SIDE ONCE THERE IS ROOM. Two columns, one row: the canvas takes
       the space the terminal does not need, and both are full height. Below this
       the grid falls back to the stacked rows above, where the terminal's 15rem
       floor applies. */
    @media (min-width: 62rem) {
      #layout {
        height: 100%;
        grid-template-columns: minmax(0, 1fr) minmax(24rem, 34%);
        /* THE STRIP IS ITS OWN ROW, and `stage` spans both so the sheet still
           gets the full height of the column beside it. auto rather than a fixed
           height: the strip is a canvas scaled to the column's width, so its
           drawn height follows its aspect ratio and the row follows the canvas
           instead of the other way round. */
        grid-template-rows: auto auto minmax(0, 1fr);
        grid-template-areas: "head head" "stage term" "stage term";
      }
      #shell { min-height: 0; }
    }
    #status.err { color: var(--err); }
    #status.ok  { color: var(--ok); }
    /* The shell page, embedded as the terminal -- the thing you interact with
       for the whole session, so it gets a guaranteed size rather than leftovers. */
    #shell {
      grid-area: term; min-height: 15rem; width: 100%; height: 100%;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--panel);
    }
  </style>
</head>
<body>
  <div id="layout">
    <header>
      <a class="brand" href="/" target="_top">ETCS Paint</a>
      <!-- Raw images in and out: a PAM/PPM file becomes a layer, and the
           composite comes back as a PAM. The page only moves bytes between the
           browser and the runtime's filesystem; the verbs do the work (see the
           script below, and README.md). -->
      <span class="files">
        <label class="btn" for="upload" title="PAM (RGB_ALPHA or RGB) or PPM, 8-bit -- becomes a new layer">upload</label>
        <input id="upload" type="file" accept=".pam,.ppm,image/x-portable-arbitrarymap,image/x-portable-pixmap"/>
        <button id="download" class="btn" type="button" title="the visible layers, composited, as PAM">download</button>
      </span>
      <span id="status">loading…</span>
    </header>
    <div id="stage">
      <canvas id="canvas" width="1024" height="768"></canvas>
    </div>
    <!-- The ShellProvider page, as the terminal VIEW only. It detects being
         framed and boots no runtime of its own; lines cross by postMessage.
         See README.md for why the runtime is here and the terminal is there.

         THE ONLY TEXT PANE ON THIS PAGE. Boot progress goes here too, through
         the same replay buffer every other line uses -- an ETCS session has one
         log, and splitting the first six lines of it into a second box above the
         terminal meant reading two places to follow one sequence. -->
    <iframe id="shell" src="shell" title="ETCS shell"></iframe>
  </div>
  <script>
(function () {
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  const shellFrame = document.getElementById('shell');

  const ORIGIN = window.location.origin;

  // ── the log ────────────────────────────────────────────────────────────
  //
  // ONE PANE. Boot lines and runtime lines are one sequence, so they go to one
  // place: the terminal. The reason that works even before the iframe can be
  // talked to is the replay buffer below -- `pending` already existed to hold
  // runtime output produced during iframe load, and boot output is the same
  // problem, so it is the same answer rather than a second widget.
  //
  // The header keeps a one-LINE status (the current step, red if it failed), so
  // a page that dies before the terminal can render still says so somewhere
  // that needs no scrolling.
  /*
   * The transcript gets the text AS IT CAME, escapes included -- the terminal
   * view is what renders SGR into colour (ShellProvider's page), and stripping
   * here would throw away the only thing carrying which span means what.
   *
   * The status line is a different medium: it is textContent on one element, so
   * an escape there is bytes on screen rather than a colour. Stripped for that
   * use and only that use.
   */
  const ANSI_STRIP = /\x1b\[[0-9;?]*[A-Za-z]/g;
  function log(text, cls) {
    termWrite(text);
    if (cls === 'err')
      setStatus(String(text).replace(ANSI_STRIP, '').trim().split('\n')[0], 'err');
  }
  function setStatus(s, cls) {
    statusEl.textContent = s;
    statusEl.className = cls || '';
  }

  // ── the bridge ─────────────────────────────────────────────────────────
  //
  // TEXT OUT, LINES IN, and nothing else crosses. The embedded page is a view:
  // it renders what the runtime printed and hands back what was typed. It holds
  // no runtime state, so there is nothing to keep in sync and no ordering to get
  // wrong -- which is what makes a frame boundary an acceptable place to put it.
  let shellReady = false;
  const pending = [];              // output produced before the view was ready

  function toShell(msg) {
    if (!shellFrame.contentWindow) return;
    shellFrame.contentWindow.postMessage(msg, ORIGIN);
  }

  // Every line the runtime prints. Named on window because that is the hook
  // etcs_web_shell_write already reaches for (loaders/etcs.cc) -- the C++ side
  // calls window.etcsTermWrite when it exists, so wiring it here is what makes
  // the runtime's own writes land in the embedded terminal rather than only in
  // Module.print.
  function termWrite(text) {
    if (!shellReady) { pending.push(text); if (pending.length > 2000) pending.shift(); return; }
    toShell({ etcs: 'out', text: text });
  }

  window.etcsTermWrite = function (t) {
    if (t == null) return;
    termWrite(String(t));
  };

  function pushLine(line) {
    const mod = window.Module;
    if (!mod) { log('[etcs] line dropped, runtime not up: ' + line + '\n', 'err'); return; }
    try {
      // ccall only. The raw export is reached through several names depending on
      // how the build exported it, and trying them in turn is what the shell
      // page used to do -- but ccall does not need the raw symbol at all, so
      // gating on finding one was the bug, not the fallback.
      mod.ccall('etcs_web_shell_push_line', null, ['string'], [line]);
    } catch (e) {
      log('[etcs] push_line failed: ' + e + '\n', 'err');
    }
  }

  /*
   * ── the one thing about the sheet the page still owns ──────────────────
   *
   * THE CONTEXT MENU, and nothing else.
   *
   * It used to be this plus a wheel handler that converted client coordinates
   * into framebuffer pixels and called ZoomBy. That handler is gone, and the
   * reason it could go is worth recording: the wheel was not missing a channel,
   * it was missing an IMPLEMENTOR. ontology/Pointer.h already carried scroll
   * deltas and said in as many words that a device converts to the surface's
   * space once, at its own edge -- so the right fix was for the window to claim
   * Pointer_ and register a GLFW scroll callback, not for the page to do
   * arithmetic GLFW was already doing correctly next door.
   *
   * What is left here genuinely cannot be a verb: the browser opens its own
   * menu on a right press, before anything in the runtime can have an opinion,
   * and right-drag is how the sheet pans.
   */
  canvas.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  function blockMiddleDefault(ev) {
    if (ev.button === 1) ev.preventDefault();
  }
  canvas.addEventListener('mousedown', blockMiddleDefault, { capture: true });
  canvas.addEventListener('mouseup', blockMiddleDefault, { capture: true });
  canvas.addEventListener('auxclick', blockMiddleDefault, { capture: true });
  canvas.addEventListener('pointerdown', blockMiddleDefault, { capture: true });
  canvas.addEventListener('pointerup', blockMiddleDefault, { capture: true });

  /*
   * ── raw images in and out ──────────────────────────────────────────────
   *
   * THE PAGE IS A FILE PROXY HERE, and nothing more. The verbs take a PATH
   * (PaintDocument::ImportImage / ExportImage), so what the page does is what
   * preRun already does for the scripts it boots: put bytes at a name in the
   * runtime's own filesystem, then say the name. Decoding, the new layer and
   * the composite are the document's -- the same lines work from the terminal,
   * and on the desktop the path is a real one. That is why there is no image
   * code on this side and no second copy of anything.
   *
   * Under /uploads and /exports rather than beside the staged scripts, so a
   * file that happens to share a script's name cannot replace it.
   */
  function etcsFS() { return (typeof FS !== 'undefined') ? FS : (window.Module && window.Module.FS); }
  // Set from onRuntimeInitialized below, which is the one signal this page
  // already trusts for "runtime ready". Module.calledRun is not it: with the
  // REPL detached to a worker the main module's run() is not what says the
  // session is up, and reading it here refused every click with the runtime
  // plainly live behind it.
  let runtimeIsUp = false;
  function runtimeUp() { return runtimeIsUp && !!(window.Module && window.Module.ccall); }
  function callVerb(name, work, args) {
    return window.Module.ccall('etcs_web_call', 'number',
                               ['string', 'string', 'string'], [name, work, args]);
  }

  /*
   * WRITING /persist BACK. IDBFS does not write through: a change to a file in
   * it reaches IndexedDB only when syncfs(false) is called. The C++ side says
   * when (PaintPages after every Save, via an `etcs-persist` event), and the
   * page also flushes on pagehide, which is the last moment a closing tab gives
   * it. navigator.storage.persist() is the "may this survive storage pressure"
   * request -- the browser's own file-storage grant -- asked once; a refusal
   * changes nothing here but how long the browser promises to keep it.
   */
  let persistTimer = 0;
  function persistNow(why) {
    const fs = etcsFS();
    if (!fs || !fs.syncfs) return;
    fs.syncfs(false, function (err) {
      if (err) log('[etcs] /persist: write to IndexedDB failed (' + why + '): ' + err + '\n', 'err');
    });
  }
  window.etcsPersist = function (why) {          // reachable from C++ through EM_ASM
    clearTimeout(persistTimer);
    persistTimer = setTimeout(function () { persistNow(why || 'requested'); }, 250);
  };
  window.addEventListener('etcs-persist', function (e) { window.etcsPersist(e.detail); });
  window.addEventListener('pagehide', function () { persistNow('pagehide'); });
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(function (granted) {
      log('[etcs] persistent storage ' + (granted ? 'granted' : 'not granted') + '\n');
    }).catch(function () {});
  }

  const uploadEl = document.getElementById('upload');
  const downloadEl = document.getElementById('download');

  uploadEl.addEventListener('change', async function () {
    const file = uploadEl.files && uploadEl.files[0];
    uploadEl.value = '';                       // so the same file can be chosen twice
    if (!file) return;
    if (!runtimeUp()) { log('[etcs] upload: runtime is not up yet\n', 'err'); return; }
    try {
      const fs = etcsFS();
      const bytes = new Uint8Array(await file.arrayBuffer());
      // The file's name is the layer's (ImportImage takes its stem), kept as
      // given except for what a path cannot carry.
      const path = '/uploads/' + file.name.replace(/[\/\\]/g, '_');
      try { fs.mkdirTree('/uploads'); } catch (e) {}
      fs.writeFile(path, bytes);
      callVerb('doc', 'ImportImage', path);
      // The document changed; the surface shows it when asked, as after every
      // scripted change (canvas.Render() in boot_paint_panels.etcs).
      callVerb('canvas', 'Render', '');
    } catch (e) {
      log('[etcs] upload failed: ' + e + '\n', 'err');
    }
  });

  // One function, two callers: the header button and the sheet's own menu
  // (below). The export is the same export whichever asked for it.
  function downloadComposite() {
    if (!runtimeUp()) { log('[etcs] download: runtime is not up yet\n', 'err'); return; }
    try {
      const fs = etcsFS();
      const path = '/exports/paint.pam';
      try { fs.mkdirTree('/exports'); } catch (e) {}
      try { fs.unlink(path); } catch (e) {}     // a stale file must not pass for this export
      callVerb('doc', 'ExportImage', path);     // says in the terminal if it refused
      const bytes = fs.readFile(path);
      const url = URL.createObjectURL(new Blob([bytes], { type: 'image/x-portable-arbitrarymap' }));
      const a = document.createElement('a');
      a.href = url; a.download = 'paint.pam';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      log('[etcs] download failed: ' + e + '\n', 'err');
    }
  }
  downloadEl.addEventListener('click', downloadComposite);

  /*
   * ── the sheet's menu, reaching the page's file controls ────────────────
   *
   * The gear's menu has "save" and "load", and a save or a load is a thing
   * only the PAGE can finish: the verbs take a path, and turning a path into a
   * file the user can see is the download above and the upload's file dialog.
   * So the runtime raises an event naming which (PaintCanvasMenu::Save, a
   * MAIN_THREAD_EM_ASM dispatch) and this answers with the same code the
   * header buttons run -- there is one download and one upload on this page.
   *
   * "load" is the one to watch. A file dialog opens only on transient user
   * activation, and the press that reached the menu was a mousedown on the
   * canvas, handled by GLFW, routed on a Worker and proxied back here -- the
   * activation is a few milliseconds old by then and should still stand
   * (browsers grant several seconds), but whether it does is the browser's
   * decision and has not been tested from this path. If a click on "load"
   * does nothing, that is why; the header's upload button is the same upload
   * from a real click and always works.
   */
  window.addEventListener('etcs-menu', function (ev) {
    const what = ev && ev.detail;
    if (what === 'save') { downloadComposite(); return; }
    if (what === 'load') { uploadEl.click(); return; }
    log('[etcs] menu: unknown request "' + what + '"\n', 'err');
  });

  window.addEventListener('message', function (ev) {
    if (ev.origin !== ORIGIN) return;
    if (ev.source !== shellFrame.contentWindow) return;
    const m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.etcs === 'view-ready') {
      shellReady = true;
      // Replay what the runtime said while the view was still loading, so a
      // session started before the iframe settled is not missing its head.
      for (const t of pending) toShell({ etcs: 'out', text: t });
      pending.length = 0;
      toShell({ etcs: 'enable', enabled: !!(window.Module && window.Module.calledRun) });
      return;
    }
    if (m.etcs === 'line') { pushLine(String(m.line == null ? '' : m.line)); return; }
  });

  // ── the include list ───────────────────────────────────────────────────
  //
  // modules.json is the source of truth and the only thing fetched blind: what
  // providers load, which .etcs files to stage, and which one is argv[1].
  function normalizeWasmList(raw) {
    let arr = [];
    if (Array.isArray(raw)) arr = raw;
    else if (raw && Array.isArray(raw.modules)) arr = raw.modules;
    else if (raw && Array.isArray(raw.wasm)) arr = raw.wasm;
    return arr.map(function (x) {
      x = String(x).trim();
      if (!x) return null;
      if (!/\.wasm$/i.test(x)) x += '.wasm';
      x = x.replace(/^\.\//, '');
      // etcs.wasm is the MAIN module -- the glue loads it, staging it as a side
      // module would load the runtime twice.
      if (/^etcs(\.wasm)?$/i.test(x) || /worker/i.test(x)) return null;
      return x;
    }).filter(Boolean);
  }

  async function fetchManifest() {
    const r = await fetch('modules.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('modules.json HTTP ' + r.status + ' -- required (no fallback list)');
    const j = await r.json();
    const wasm = normalizeWasmList(j);
    if (!wasm.length) throw new Error('modules.json names no modules');
    const scripts = (j && Array.isArray(j.scripts) ? j.scripts : [])
      .map(function (s) { return String(s).trim().replace(/^\.\//, ''); })
      .filter(Boolean);
    const boot = (j && j.boot) ? String(j.boot).trim().replace(/^\.\//, '') : '';
    const glue = (j && j.glue) ? String(j.glue).trim().replace(/^\.\//, '') : '';
    log('[etcs] modules.json -> ' + wasm.join(', ') + '\n');
    if (scripts.length) log('[etcs] scripts -> ' + scripts.join(', ') + '\n');
    return { wasm: wasm, scripts: scripts, boot: boot, glue: glue };
  }

  async function fetchAll(names, kind) {
    const out = {};
    for (const name of names) {
      setStatus('fetch ' + name);
      const r = await fetch(name, { cache: 'no-store' });
      if (!r.ok) throw new Error('fetch ' + name + ' failed HTTP ' + r.status);
      const buf = new Uint8Array(await r.arrayBuffer());
      if (!buf.byteLength) throw new Error(name + ' is empty');
      out[name] = buf;
      log('[etcs] staged ' + name + ' (' + buf.byteLength + ' bytes)\n', 'ok');
    }
    void kind;
    return out;
  }

  function loadGlue(src) {
    return new Promise(function (resolve, reject) {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = resolve; s.onerror = reject;
      document.body.appendChild(s);
    });
  }

  async function boot() {
    setStatus('fetching…');
    const man = await fetchManifest();
    const blobs = Object.assign({}, await fetchAll(man.wasm, 'module'),
                                    await fetchAll(man.scripts, 'script'));

    if (man.boot && !blobs[man.boot])
      throw new Error('modules.json boot="' + man.boot + '" is not in its scripts list');

    var Module = {
      canvas: canvas,
      /*
       * ARGV, AND THIS IS THE WHOLE OF "THE PUMP ALREADY EXISTS ON LOAD".
       *
       * argv[1] is the boot script, so main() takes the script path, runs it,
       * and then falls through to the navigator -- script mode and REPL mode are
       * not alternatives in this binary (drive_main_loop_then_exit, after the
       * run_script call in loaders/etcs.cc). So the window and its input pump
       * are up before the first prompt is drawn, with no new C++ entry point and
       * no page-driven menu typing.
       */
      arguments: man.boot ? [man.boot] : [],
      print: function (t) {
        window.etcsTermWrite(t + (String(t).endsWith('\n') ? '' : '\n'));
      },
      printErr: function (t) {
        // log() writes to the terminal itself now, so this is ONE write, not
        // two -- it also lifts the first line into the status.
        log(t + (String(t).endsWith('\n') ? '' : '\n'), 'err');
      },
      dynamicLibraries: [],
      locateFile: function (path) { return path; },
      preRun: [function () {
        // Into MEMFS before main(): preload_web_modules dlopens the .wasm files
        // by name and run_script opens the boot script by name, so both have to
        // be on the filesystem the runtime sees, not just in a JS variable.
        try {
          for (const name of Object.keys(blobs)) {
            // A NAME MAY BE A PATH, and the directories have to exist first.
            // The point of allowing one is that a script can then be staged at
            // the SAME relative path the OS side reads it from, so a `detach`
            // line does not have to be spelled differently for the browser.
            const slash = name.lastIndexOf('/');
            if (slash > 0) { try { FS.mkdirTree(name.slice(0, slash)); } catch (e) {} }
            try { FS.writeFile(name, blobs[name]); }
            catch (e) {
              FS.createDataFile('/', name.replace(/^\.\//, ''), blobs[name], true, true, true);
            }
          }
          log('[etcs] MEMFS preload complete (' + Object.keys(blobs).length + ' files)\n');
        } catch (e) {
          // NOT swallowed per-file: if FS itself is unavailable every later name
          // is missing too, and reporting the first one is what tells you which.
          log('[etcs] preRun FS error: ' + e + '\n', 'err');
        }
        /*
         * /persist OUTLIVES THE TAB. Everything else on this filesystem is
         * MEMFS and gone on reload; this one directory is IDBFS, a MEMFS view
         * of an IndexedDB store, and what the page store keeps its sqlite file
         * in (boot_paint_panels.etcs: db.Connect(/persist/pages.db)). The
         * database is just a file at a path -- the same file the desktop
         * writes -- which is why nothing on the C++ side knows the browser is
         * involved. syncfs(true) pulls last time's bytes in before main() runs;
         * addRunDependency holds the runtime until it has, because a database
         * opened before its file arrives would be a fresh one written over it.
         */
        try {
          FS.mkdir('/persist');
          FS.mount(IDBFS, {}, '/persist');
          Module.addRunDependency('etcs-persist');
          FS.syncfs(true, function (err) {
            if (err) log('[etcs] /persist: could not read IndexedDB: ' + err + '\n', 'err');
            else     log('[etcs] /persist mounted from IndexedDB\n');
            Module.removeRunDependency('etcs-persist');
          });
        } catch (e) {
          log('[etcs] /persist: IDBFS unavailable (' + e + ') -- pages will not outlive this tab\n', 'err');
        }
      }],
      onRuntimeInitialized: function () {
        setStatus('runtime ready', 'ok');
        runtimeIsUp = true;
        log('[etcs] runtime initialized; boot script: '
            + (man.boot || '(none)') + '\n', 'ok');
        if (shellReady) toShell({ etcs: 'enable', enabled: true });
      },
      onAbort: function (r) {
        setStatus('aborted', 'err');
        log('[abort] ' + r + '\n', 'err');
        if (shellReady) toShell({ etcs: 'enable', enabled: false });
      }
    };
    window.Module = Module;

    /*
     * THE GLUE IS NAMED, NOT PROBED.
     *
     * Trying 'etcs.js' and falling back to 'etcs' meant every load logged a
     * failed script fetch in the console -- a real error for an expected
     * condition, which is the kind that trains you to ignore the console. The
     * manifest already says what to load; this is one more thing it says.
     *
     * The probe stays as the no-manifest-entry path so an older deployment that
     * has not added "glue" keeps working, with the reason logged rather than the
     * browser's bare failure.
     */
    if (man.glue) {
      setStatus('loading ' + man.glue + '…');
      await loadGlue(man.glue);
    } else {
      setStatus('loading glue…');
      log('[etcs] modules.json names no "glue" -- probing etcs.js then etcs\n');
      try { await loadGlue('etcs.js'); }
      catch (_) { await loadGlue('etcs'); }
    }
  }

  boot().catch(function (e) {
    setStatus('boot failed', 'err');
    log('[etcs] boot: ' + e + '\n', 'err');
  });
})();
  </script>
</body>
</html>
