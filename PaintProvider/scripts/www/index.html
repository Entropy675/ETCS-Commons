    if (verb !== 'writer' && verb !== 'reader' && verb !== 'out') return;
    await nodeGet(tokenPath('role', who, verb));
    await refreshRoster();
  });

  /*
   * ── one hand on a text box ────────────────────────────────────────────────
   *
   * The runtime says when a box is selected (claim), typed into (touch) and
   * let go (release) -- PaintDocument::SelectTextBox -- and the node decides
   * who has it. A claim refused puts the box back as it was (TextDenied). The
   * release goes AFTER a push, so the submission is in the room before the box
   * is anyone else's to take. A hand idle for SHARE_TEXT_IDLE_MS lets go by
   * itself: the box is submitted as it stands, and the node would have let the
   * claim lapse soon after anyway.
   */
  const SHARE_TEXT_IDLE_MS = 20000;
  const SHARE_TEXT_RENEW_MS = 5000;
  const text = { key: null, renewed: 0, idle: 0 };

  function textIdleArm() {
    clearTimeout(text.idle);
    text.idle = setTimeout(function () {
      if (text.key && runtimeUp()) {
        log('[etcs] text box let go after a while with no typing -- sent as it stands\n');
        callVerb('doc', 'SelectTextBox', '0');
      }
    }, SHARE_TEXT_IDLE_MS);
  }

  window.addEventListener('etcs-text', async function (ev) {
    const what = (ev && ev.detail) || '';
    if (!share.token) return;
    const colon = what.indexOf(':');
    const verb = what.slice(0, colon), key = what.slice(colon + 1);
    if (verb === 'claim') {
      text.key = key; text.renewed = Date.now(); textIdleArm();
      const got = await nodeGet(tokenPath('claim', encodeURIComponent(key)));
      if (got && got.startsWith('held ')) {
        const who = got.slice(5).trim();
        callVerb('doc', 'TextDenied', key + ', ' + who);
        callVerb('canvas', 'Render', '');
        log('[etcs] ' + who + ' is editing that text -- it is theirs until they let go\n', 'err');
        if (text.key === key) { text.key = null; clearTimeout(text.idle); }
      }
      return;
    }
    if (verb === 'touch') {
      textIdleArm();
      if (Date.now() - text.renewed > SHARE_TEXT_RENEW_MS) {
        text.renewed = Date.now();
        await nodeGet(tokenPath('claim', encodeURIComponent(key)));
      }
      return;
    }
    if (verb === 'release') {
      if (text.key === key) { text.key = null; clearTimeout(text.idle); }
      // A push already in flight (or a read) holds `busy`; wait it out so this
      // one is the push that carries the box.
      for (let i = 0; i < 60 && share.busy; i++) await new Promise(function (r) { setTimeout(r, 50); });
      await pushMine();
      await nodeGet(tokenPath('release', encodeURIComponent(key)));
    }
  });

  // A link opened cold. Waits for the BOOT, not only the runtime: the runtime
  // is up seconds before boot_paint_panels.etcs has spawned the document and
  // the page store, and a join that lands in between replays into nothing --
  // the joiner kept their own blank page and never got the host's. The import
  // prompt's input is one of the last names the boot script makes.
  (function () {
    const id = new URLSearchParams(window.location.search).get('s');
    if (!id) return;
    const t = setInterval(function () {
      if (!runtimeUp() || !nameLive('import_input') || !nameLive('pages')) return;
      clearInterval(t);
      joinFromLink(id.replace(/[^0-9a-f]/g, '').slice(0, 40));
    }, 500);
  })();

  /*
   * ── the sheet's menu, reaching the page's file controls ────────────────
   *
   * The gear's menu has "save" and "load". Save goes to the page STORE when
   * one is bound (PaintCanvasMenu::Save -> PaintPages::Save) and reaches here
   * only on a runtime with no store, where the download is the one place a
   * picture can go. Load takes a file, and a file is a thing only the PAGE can
   * produce: the verb takes a path, and turning a path into a file the user
   * can see is the upload's dialog. So the runtime raises an event naming
   * which (a MAIN_THREAD_EM_ASM dispatch) and this answers with the same code
   * the header buttons run -- there is one download and one upload on this
   * page.
   *
   * "load" is the one to watch. A file dialog opens only on transient user
   * activation, and the press that reached the menu was a mousedown on the
   * canvas, handled by GLFW, routed on a Worker and proxied back here -- the
   * activation is a few milliseconds old by then and should still stand
   * (browsers grant several seconds), but whether it does is the browser's
   * decision and has not been tested from this path. If a click on "load"
   * does nothing, that is why; the header's upload button is the same upload
   * from a real click and always works.
   */
  // The reel as a GIF: the animation window's button raises this
  // (PaintAnimation::Download), the encoder writes the file here, and the
  // page hands it over the same way the PNG goes.
  function downloadGif() {
    if (!runtimeUp()) { log('[etcs] gif: runtime is not up yet\n', 'err'); return; }
    try {
      const fs = etcsFS();
      const path = '/exports/anim.gif';
      try { fs.mkdirTree('/exports'); } catch (e) {}
      try { fs.unlink(path); } catch (e) {}
      callVerb('anim', 'ExportGif', path);
      const bytes = fs.readFile(path);
      const url = URL.createObjectURL(new Blob([bytes], { type: 'image/gif' }));
      const a = document.createElement('a');
      a.href = url; a.download = 'anim.gif';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      log('[etcs] gif download failed: ' + e + '\n', 'err');
    }
  }

  window.addEventListener('etcs-menu', function (ev) {
    const what = ev && ev.detail;
    if (what === 'save') { downloadComposite(); return; }
    if (what === 'load') { uploadEl.click(); return; }
    if (what === 'gif')  { downloadGif(); return; }
    log('[etcs] menu: unknown request "' + what + '"\n', 'err');
  });

  window.addEventListener('message', function (ev) {
    if (ev.origin !== ORIGIN) return;
    if (ev.source !== shellFrame.contentWindow) return;
    const m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.etcs === 'term-collapse') {
      document.getElementById('layout').classList.toggle('shell-collapsed', !!m.collapsed);
      try { if (typeof stageResize === 'function') stageResize(); } catch (e) {}
      return;
    }
    if (m.etcs === 'view-ready') {
      shellReady = true;
      // Replay what the runtime said while the view was still loading, so a
      // session started before the iframe settled is not missing its head.
      for (const t of pending) toShell({ etcs: 'out', text: t });
      pending.length = 0;
      toShell({ etcs: 'enable', enabled: !!(window.Module && window.Module.calledRun) });
      if (lastMenuJson) toShell({ etcs: 'menu', json: lastMenuJson });
      return;
    }
    if (m.etcs === 'line') { pushLine(String(m.line == null ? '' : m.line)); return; }
  });

  // ── the include list ───────────────────────────────────────────────────
  //
  // modules.json is the source of truth and the only thing fetched blind: what
  // providers load, which .etcs files to stage, and which one is argv[1].
  function normalizeWasmList(raw) {
    let arr = [];
    if (Array.isArray(raw)) arr = raw;
    else if (raw && Array.isArray(raw.modules)) arr = raw.modules;
    else if (raw && Array.isArray(raw.wasm)) arr = raw.wasm;
    return arr.map(function (x) {
      x = String(x).trim();
      if (!x) return null;
      if (!/\.wasm$/i.test(x)) x += '.wasm';
      x = x.replace(/^\.\//, '');
      // etcs.wasm is the MAIN module -- the glue loads it, staging it as a side
      // module would load the runtime twice.
      if (/^etcs(\.wasm)?$/i.test(x) || /worker/i.test(x)) return null;
      return x;
    }).filter(Boolean);
  }

  async function fetchManifest() {
    const r = await fetch('modules.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('modules.json HTTP ' + r.status + ' -- required (no fallback list)');
    const j = await r.json();
    const wasm = normalizeWasmList(j);
    if (!wasm.length) throw new Error('modules.json names no modules');
    const scripts = (j && Array.isArray(j.scripts) ? j.scripts : [])
      .map(function (s) { return String(s).trim().replace(/^\.\//, ''); })
      .filter(Boolean);
    const assets = (j && Array.isArray(j.assets) ? j.assets : [])
      .map(function (s) { return String(s).trim().replace(/^\.\//, ''); })
      .filter(Boolean);
    const boot = (j && j.boot) ? String(j.boot).trim().replace(/^\.\//, '') : '';
    const glue = (j && j.glue) ? String(j.glue).trim().replace(/^\.\//, '') : '';
    // Optional. Naming it skips the candidate walk in resolveWasmBase, for a
    // deployment that knows where its artifacts are and would rather not have
    // the page guess -- a CDN, or a second origin.
    const base = (j && j.base) ? String(j.base).trim() : '';
    log('[etcs] modules.json -> ' + wasm.join(', ') + '\n');
    if (scripts.length) log('[etcs] scripts -> ' + scripts.join(', ') + '\n');
    // Kept for explainWorkerDeath: the per-Worker cost is proportional to it.
    man_module_count = wasm.length;
    return { wasm: wasm, scripts: scripts, assets: assets, boot: boot, glue: glue, base: base };
  }

  /*
   * WHAT ARRIVED HAS TO BE WHAT WAS ASKED FOR, and a 200 does not say that.
   *
   * Only boot_paint_panels.etcs is actually a file under www/; every other
   * script here exists on the served surface because serve_paint.etcs MOUNTS
   * it, from a RELATIVE path that resolves against the server's working
   * directory. Get that wrong, or leave a stale copy in www/ for LoadFromDisk
   * to find first, and the fetch still succeeds -- with an error page, a
   * directory listing, or last week's file.
   *
   * WHICH IS SILENT UNTIL IT IS BAFFLING. A staged non-script is written into
   * the filesystem, `detach` launches it, and the script thread dies on the
   * first line. The one that matters is render_frames.etcs: nothing else in
   * this page calls Present, so its thread dying leaves a BLACK CANVAS and a
   * runtime that is otherwise working perfectly. That failure has nothing in
   * it pointing back here, which is the whole reason for the two checks below.
   *
   * CHEAP AND STRUCTURAL, not a parse. A module must open with the WebAssembly
   * magic; a script must not open with '<', because no .etcs line does and
   * every wrong answer a web server gives is markup. Neither check can reject
   * a file that is genuinely what it claims to be, which is the only property
   * worth having here -- a stricter test would start failing on valid input
   * the first time the language grows.
   */
  const WASM_MAGIC = [0x00, 0x61, 0x73, 0x6d];

  function checkStaged(name, kind, buf) {
    if (kind === 'asset') return;          // binary by design: a font is not markup or a script
    if (kind === 'module') {
      const ok = buf.byteLength >= 4 && WASM_MAGIC.every((b, i) => buf[i] === b);
      if (!ok) throw new Error(name + ' is not a WebAssembly module -- it starts '
        + '0x' + Array.from(buf.slice(0, 4)).map(b => b.toString(16).padStart(2, '0')).join('')
        + '. The server answered 200 with something else; check what it is serving '
        + 'at that path.');
      return;
    }
    let i = 0;
    while (i < buf.byteLength && (buf[i] === 32 || buf[i] === 9 || buf[i] === 10 || buf[i] === 13)) i++;
    if (i < buf.byteLength && buf[i] === 0x3c /* '<' */)
      throw new Error(name + ' is markup, not an .etcs script. It is mounted by '
        + 'serve_paint.etcs from a path relative to the server\'s working directory; '
        + 'check FileHtmlPage::ListPaths in the server log for what is actually '
        + 'mounted there, and check www/ for a stale copy shadowing the mount.');
  }

  /*
   * WHAT `worker sent an error!` MEANS, said once, where it can be said at all.
   *
   * A Worker that dies cannot be reached from C++: emscripten re-instantiates
   * every open dynamic library inside each new Worker, and when that fails the
   * Worker is gone before any ETCS frame runs in it. The runtime's own guards
   * (ThreadPool::start_workers, the detach in CommandExecutor.h) only catch the
   * SYNCHRONOUS refusal -- pthread_create saying no. This one surfaces as three
   * lines of emscripten internals and nothing else, so the page is the only
   * controlled point left, and this is it.
   *
   * THE THREE LINES ARE ONE EVENT, in this order, and reading them as three
   * problems is the trap: the Worker reports out-of-memory, `_dlopen_js failed`
   * names the library it could not bring up, and then something proceeds on the
   * failure and faults -- `ASM_CONSTS is undefined` is an EM_ASM block running
   * in a Worker whose glue never finished, and `index out of bounds` is the
   * result. Only the FIRST is a cause.
   *
   * ONCE PER PAGE. There are dozens of Workers and they fail together; the
   * explanation does not get truer for being printed forty times, and the
   * repetition is what buries the first line that mattered.
   */
  let workerDeathExplained = false;
  function explainWorkerDeath(t) {
    if (workerDeathExplained) return;
    if (!/worker sent an error|could not load dynamic lib|ASM_CONSTS is undefined/.test(t)) return;
    workerDeathExplained = true;
    log('[etcs] A Worker died. This is browser memory, NOT the wasm heap -- '
      + 'raising INITIAL_MEMORY will not change it.\n'
      + '[etcs]   Each Worker re-instantiates every open module for itself, so the '
      + 'cost is workers x modules. This page loads ' + (man_module_count || '?')
      + ' side modules and the runtime creates one thread pool PER IMAGE '
      + '(DEFAULT_THREAD_POOL_THREADS, core/ETCS_API.h).\n'
      + '[etcs]   Lower that, or load fewer providers, or give the machine more RAM. '
      + 'Any "index out of bounds" or "ASM_CONSTS is undefined" after this line is '
      + 'the consequence, not a second fault.\n', 'err');
  }
  let man_module_count = 0;

  /*
   * WHERE THE WASM COMES FROM IS NOT WHERE THIS PAGE LIVES. The runtime
   * binaries are shared and move in epochs, so they live in one place --
   * bin/wasm/, mounted at /wasm/ by the serve scripts (Makefile, WASM_DIR, for
   * the argument) -- and every page fetches them from there. The base affects
   * only the FETCH; what is written into MEMFS stays the bare name, because
   * preload_web_modules dlopens by name. Scripts are not in here: they are
   * mounted beside the page at the paths the OS side reads them from.
   *
   * Resolved by trying: same-origin /wasm/ first, because a local server must
   * not need a setting; then beside the page, which is what a deployment made
   * before the shared directory looks like; then the known-good remote.
   * modules.json may name a "base" to skip the walk. The first candidate whose
   * bytes carry the WebAssembly magic wins -- a 200 is not evidence, and every
   * wrong answer a web server gives is markup. Identical across every page in
   * this tree on purpose: one shared artifact directory is the point, and two
   * pages disagreeing about where it is would undo it.
   *
   * The probe's bytes are kept: the first module has to be fetched anyway.
   */
  const WASM_BASE_CANDIDATES = ['/wasm/', './', 'https://anticurrententropy.com/wasm/'];
  let wasm_base = null;
  let wasm_probe = null;   // {name, buf} -- the module the probe already pulled

  function joinBase(base, name) {
    return (base === './') ? name : base.replace(/\/*$/, '/') + name;
  }

  async function resolveWasmBase(declared, firstModule) {
    const candidates = declared ? [declared] : WASM_BASE_CANDIDATES;
    const tried = [];
    for (const base of candidates) {
      const url = joinBase(base, firstModule);
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) { tried.push(base + ' HTTP ' + r.status); continue; }
        const buf = new Uint8Array(await r.arrayBuffer());
        checkStaged(firstModule, 'module', buf);   // throws on markup / wrong magic
        wasm_base  = base;
        wasm_probe = { name: firstModule, buf: buf };
        log('[etcs] wasm base -> ' + base + '\n', 'ok');
        return base;
      } catch (e) {
        tried.push(base + ' ' + (e && e.message ? e.message : e));
      }
    }
    // Named, not summarised: which candidates were tried and what each said is
    // the whole diagnosis, and there is no fallback left to hide behind.
    throw new Error('no wasm base serves ' + firstModule + ' -- tried '
      + tried.join('; ') + '. `ace wasm make loader etcs` writes bin/wasm/, and a '
      + 'serve script mounts it at /wasm/ (see run_tls_website.etcs).');
  }

  // base null means "beside the page" -- what scripts always want.
  async function fetchAll(names, kind, base) {
    const out = {};
    for (const name of names) {
      if (wasm_probe && wasm_probe.name === name) {
        out[name] = wasm_probe.buf;
        log('[etcs] staged ' + name + ' (' + wasm_probe.buf.byteLength
            + ' bytes, from the base probe)\n', 'ok');
        continue;
      }
      setStatus('fetch ' + name);
      const url = base ? joinBase(base, name) : name;
      const r = await fetch(url, { cache: 'no-store' });
      const buf = r.ok ? new Uint8Array(await r.arrayBuffer()) : null;
      // An asset is optional: a font that did not arrive leaves its slot to the
      // pixel font (PaintFonts::Load answers "missing") instead of stopping the
      // page. A script or module that did not arrive is a broken install.
      if (kind === 'asset' && !(buf && buf.byteLength)) {
        log('[etcs] skipped ' + name + ' (' + (r.ok ? 'empty' : 'HTTP ' + r.status)
            + '; see its folder README)\n', 'warn');
        continue;
      }
      if (!r.ok) throw new Error('fetch ' + url + ' failed HTTP ' + r.status);
      if (!buf.byteLength) throw new Error(url + ' is empty');
      checkStaged(name, kind, buf);
      out[name] = buf;
      log('[etcs] staged ' + name + ' (' + buf.byteLength + ' bytes)\n', 'ok');
    }
    return out;
  }

  function loadGlue(src) {
    return new Promise(function (resolve, reject) {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = resolve; s.onerror = reject;
      document.body.appendChild(s);
    });
  }

  async function boot() {
    setStatus('fetching…');
    const man = await fetchManifest();
    // Base first: it is decided by fetching man.wasm[0], and fetchAll below
    // reuses those bytes rather than asking for them again.
    setStatus('locating runtime…');
    await resolveWasmBase(man.base, man.wasm[0]);
    const blobs = Object.assign({}, await fetchAll(man.wasm, 'module', wasm_base),
                                    await fetchAll(man.scripts, 'script', null),
                                    await fetchAll(man.assets, 'asset', null));

    if (man.boot && !blobs[man.boot])
      throw new Error('modules.json boot="' + man.boot + '" is not in its scripts list');

    var Module = {
      canvas: canvas,
      /*
       * ARGV, AND THIS IS THE WHOLE OF "THE PUMP ALREADY EXISTS ON LOAD".
       *
       * argv[1] is the boot script, so main() takes the script path, runs it,
       * and then falls through to the navigator -- script mode and REPL mode are
       * not alternatives in this binary (drive_main_loop_then_exit, after the
       * run_script call in loaders/etcs.cc). So the window and its input pump
       * are up before the first prompt is drawn, with no new C++ entry point and
       * no page-driven menu typing.
       */
      arguments: man.boot ? [man.boot] : [],
      print: function (t) {
        window.etcsTermWrite(t + (String(t).endsWith('\n') ? '' : '\n'));
      },
      printErr: function (t) {
        // log() writes to the terminal itself now, so this is ONE write, not
        // two -- it also lifts the first line into the status.
        log(t + (String(t).endsWith('\n') ? '' : '\n'), 'err');
        explainWorkerDeath(String(t));
      },
      dynamicLibraries: [],
      /*
       * THE MAIN MODULE IS FETCHED BY THE GLUE, NOT BY THIS PAGE, so it is the
       * one artifact the base has to reach through emscripten rather than
       * through fetchAll. etcs.wasm never appears in the include list --
       * normalizeWasmList drops it on purpose, because staging the main module
       * as a side module loads the runtime twice.
       *
       * Left as `return path` this resolved against the PAGE, which was fine
       * only while the artifacts sat beside it. With them at /wasm/ and the page
       * possibly at /paint/, that asks for /paint/etcs.wasm and gets the site's
       * 404 -- and the failure arrives from inside the glue, where nothing
       * points back here.
       */
      locateFile: function (path) { return joinBase(wasm_base, path); },
      preRun: [function () {
        // Into MEMFS before main(): preload_web_modules dlopens the .wasm files
        // by name and run_script opens the boot script by name, so both have to
        // be on the filesystem the runtime sees, not just in a JS variable.
        try {
          for (const name of Object.keys(blobs)) {
            // A NAME MAY BE A PATH, and the directories have to exist first.
            // The point of allowing one is that a script can then be staged at
            // the SAME relative path the OS side reads it from, so a `detach`
            // line does not have to be spelled differently for the browser.
            const slash = name.lastIndexOf('/');
            if (slash > 0) { try { FS.mkdirTree(name.slice(0, slash)); } catch (e) {} }
            try { FS.writeFile(name, blobs[name]); }
            catch (e) {
              FS.createDataFile('/', name.replace(/^\.\//, ''), blobs[name], true, true, true);
            }
          }
          log('[etcs] MEMFS preload complete (' + Object.keys(blobs).length + ' files)\n');
        } catch (e) {
          // NOT swallowed per-file: if FS itself is unavailable every later name
          // is missing too, and reporting the first one is what tells you which.
          log('[etcs] preRun FS error: ' + e + '\n', 'err');
        }
        /*
         * /persist OUTLIVES THE TAB. Everything else on this filesystem is
         * MEMFS and gone on reload; this one directory is IDBFS, a MEMFS view
         * of an IndexedDB store, and what the page store keeps its sqlite file
         * in (boot_paint_panels.etcs: db.Connect(/persist/pages.db)). The
         * database is just a file at a path -- the same file the desktop
         * writes -- which is why nothing on the C++ side knows the browser is
         * involved. syncfs(true) pulls last time's bytes in before main() runs;
         * addRunDependency holds the runtime until it has, because a database
         * opened before its file arrives would be a fresh one written over it.
         */
        try {
          FS.mkdir('/persist');
          FS.mount(IDBFS, {}, '/persist');
          Module.addRunDependency('etcs-persist');
          FS.syncfs(true, function (err) {
            if (err) log('[etcs] /persist: could not read IndexedDB: ' + err + '\n', 'err');
            else     log('[etcs] /persist mounted from IndexedDB\n');
            Module.removeRunDependency('etcs-persist');
          });
        } catch (e) {
          log('[etcs] /persist: IDBFS unavailable (' + e + ') -- pages will not outlive this tab\n', 'err');
        }
      }],
      onRuntimeInitialized: function () {
        setStatus('runtime ready', 'ok');
        runtimeIsUp = true;
        startShellDrain();
        startStageResize();
        keyboardBridge();
        log('[etcs] runtime initialized; boot script: '
            + (man.boot || '(none)') + '\n', 'ok');
        if (shellReady) toShell({ etcs: 'enable', enabled: true });
      },
      onAbort: function (r) {
        setStatus('aborted', 'err');
        log('[abort] ' + r + '\n', 'err');
        if (shellReady) toShell({ etcs: 'enable', enabled: false });
      }
    };
    window.Module = Module;

    /*
     * THE GLUE IS NAMED, NOT PROBED.
     *
     * Trying 'etcs.js' and falling back to 'etcs' meant every load logged a
     * failed script fetch in the console -- a real error for an expected
     * condition, which is the kind that trains you to ignore the console. The
     * manifest already says what to load; this is one more thing it says.
     *
     * The probe stays as the no-manifest-entry path so an older deployment that
     * has not added "glue" keeps working, with the reason logged rather than the
     * browser's bare failure.
     */
    // FROM THE SAME BASE AS THE MODULES, because it is the same artifact set:
    // the glue and etcs.wasm are one link's output and a mismatched pair is the
    // one combination that fails before any ETCS code runs. Already resolved
    // above, so this cannot pick a different origin than the modules did.
    if (man.glue) {
      setStatus('loading ' + man.glue + '…');
      await loadGlue(joinBase(wasm_base, man.glue));
    } else {
      setStatus('loading glue…');
      log('[etcs] modules.json names no "glue" -- probing etcs.js then etcs\n');
      try { await loadGlue(joinBase(wasm_base, 'etcs.js')); }
      catch (_) { await loadGlue(joinBase(wasm_base, 'etcs')); }
    }
  }

  /*
   * ── the boot throbber ──────────────────────────────────────────────────────
   *
   * PAGE-SIDE, AND THAT IS A MEASURED DECISION RATHER THAN A SHORTCUT.
   *
   * RenderProvider has a Throbber leaf that rides the frame edge, and the
   * obvious thing is to put one up on the first lines of boot_paint_panels.etcs
   * and let the runtime draw it. It cannot work, and the timeline is why.
   * Measured in a headless Chromium against this page:
   *
   *     0.45s   modules loaded, boot script handed to a Worker
   *     0-0.5s  nearly every Worker the session will have, created in one
   *             burst -- every pthread is a Worker and every Worker
   *             re-instantiates every open side module
   *     8.8s    the first frame the runtime presents (16 Workers, one shared
   *             pool; 10.5s with a pool per image)
   *
   * A boot script a quarter the length of this one moves none of those numbers:
   * the delay is the runtime coming up, not the scene being built, and the
   * script's own Worker is competing for cores with every other one while they
   * all instantiate the same modules. A frame edge cannot draw before it
   * exists, and it does not exist until the interval it would be drawing for
   * has mostly passed.
   *
   * THE MAIN THREAD IS FINE THROUGHOUT, which is what makes this work: a rAF
   * heartbeat records ~850 frames over 20 seconds with no gap above 250ms. The
   * page is responsive the whole time the runtime is not, so the one thing that
   * can paint those seconds is the page. This costs one rAF loop and no Worker,
   * and it is up on the first frame after DOMContentLoaded.
   *
   * THE SAME PICTURE AS THE RUNTIME'S, deliberately: twelve dots, the head
   * bright blue fading back through violet, "ETCS" inside the ring in
   * off-white, straight over the sheet with no plate, the element exactly
   * the ring's square so that centring the element centres the ring
   * (Throbber.h has the same argument). The blue and
   * the violet are the canvas's own box-shadow (rgba(0,0,255) and
   * rgba(100,0,228) in the CSS above), so the wait indicator and the frame
   * around the thing being waited for are the same two colours.
   *
   * STEPS PER FRAME, not per second, matching Throbber::AdvanceConcrete -- so a
   * browser that is struggling shows a throbber that is visibly struggling,
   * which during a boot is the single most useful thing it could be saying.
   */
  function bootThrobber() {
    const el = document.getElementById('bootthrob');
    const sheet = document.getElementById('canvas');
    if (!el || !sheet) return;
    const g = el.getContext('2d');
    if (!g) { el.remove(); return; }

    const RING = el.width, DOTS = 12, TAIL = 0.45, STEP = 5.4 / 360;
    const HEAD = [0.35, 0.55, 0.95], TAILC = [0.58, 0.40, 0.95];
    const cx = RING / 2, cy = RING / 2;
    const dotR = RING * 0.08, orbit = RING * 0.5 - dotR - RING / 24;   // Throbber::orbit
    let phase = 0, stopped = false;

    // Sized to the hole the way Throbber::SetSize sizes its label: 16px is
    // the runtime's scale-2 bitmap face at this ring, and the same run width.
    g.font = '600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';

    function frame() {
      if (stopped) return;
      g.clearRect(0, 0, el.width, el.height);
      g.fillStyle = 'rgba(240, 227, 199, 0.95)';    // the off-white the runtime uses
      g.letterSpacing = '2px';
      // +1 x: letterSpacing trails the last glyph too; +2 y: 'middle' is the
      // em box's middle, and capitals sit above it. Both measured, not guessed.
      g.fillText('ETCS', cx + 1, cy + 2);
      for (let i = 0; i < DOTS; i++) {
        const at = i / DOTS;
        // Short way round, so the tail stays continuous across the wrap --
        // the same arithmetic as Throbber::repaint.
        let d = phase - at; d = d - Math.floor(d); if (d > 0.5) d = 1 - d;
        let t = 1 - (d / TAIL); if (t < 0) t = 0; t = t * t;
        const a = 0.14 + (1 - 0.14) * t;
        const c = HEAD.map((h, k) => Math.round(255 * (TAILC[k] + (h - TAILC[k]) * t)));
        const ang = at * Math.PI * 2 - Math.PI / 2;
        g.beginPath();
        g.arc(cx + orbit * Math.cos(ang), cy + orbit * Math.sin(ang), dotR, 0, Math.PI * 2);
        g.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')';
        g.fill();
      }
      phase = (phase + STEP) % 1;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /*
     * IT LEAVES WHEN THERE IS SOMETHING TO LEAVE FOR, and the runtime's own
     * picture is the only honest signal -- there is no channel from a script
     * back to this page, and a timeout would be a guess that is wrong on both
     * a fast machine and a slow one.
     *
     * The sheet stays at its background colour until boot_paint_panels.etcs
     * unhides the scene on its last lines, so "the centre has something in it"
     * means the scene arrived. Sampled every 200ms over a small centre block,
     * which is cheap enough to be uninteresting next to a wasm boot.
     *
     * Read failures are counted, not swallowed: if the canvas is ever
     * cross-origin or context-less this cannot work at all, and after a few
     * seconds of that the overlay leaves anyway rather than covering the
     * application forever.
     */
    let bad = 0;
    const poll = setInterval(function () {
      let done = false;
      try {
        const sg = sheet.getContext('2d', { willReadFrequently: true });
        if (!sg) { bad++; }
        else {
          const w = 160, h = 160;
          const d = sg.getImageData((sheet.width - w) / 2, (sheet.height - h) / 2, w, h).data;
          let lit = 0;
          for (let k = 0; k < d.length; k += 16)
            if (d[k] > 45 || d[k + 1] > 45 || d[k + 2] > 70) lit++;
          if (lit > 40) done = true;
        }
      } catch (e) { bad++; }
      if (done || bad > 25) {
        stopped = true; clearInterval(poll); el.remove();
        sceneUp = true;
        log('[etcs] boot throbber done'
            + (bad > 25 ? ' (could not read the sheet -- leaving anyway)' : '') + '\n');
      }
    }, 200);
  }
  bootThrobber();

  boot().catch(function (e) {
    setStatus('boot failed', 'err');
    log('[etcs] boot: ' + e + '\n', 'err');
  });
})();
  </script>
</body>
</html>
