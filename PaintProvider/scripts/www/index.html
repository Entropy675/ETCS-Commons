<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ETCS Paint</title>
  <!-- The site's own marks, mounted at /favicon by the serve script so these
       resolve here exactly as they do on anticurrententropy.com. -->
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <style>
    :root {
      /* Palette from chess.html (ACE Chess) so shell / window share the same surface. */
      --light: #e8e2d5; --dark: #7a8a6f; --sel: #c9b458; --ink: #1c1c1a;
      --bg: #14150f; --panel: #1b1c14; --line: #3b3d31; --dim: #8d907c;
      /* Aliases used by the existing rules */
      --border: var(--line);
      --fg: var(--light);
      --muted: var(--dim);
      --accent: var(--sel);
      --ok: #7a9a5a;
      --err: #c45c4a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body { overflow-y: auto; }

    /*
     * GRID: THE CANVAS TAKES EVERYTHING THE TERMINAL DOES NOT NEED.
     *
     * The canvas IS the framebuffer now, at whatever size this grid gives it
     * (stageResize, below) -- so there is still no size it is "meant" to be,
     * and the right size is still all of it, but the scene inside grows to
     * match rather than being scaled up to fit.
     * The terminal is the one thing on the page with a natural size: 15rem is
     * 8 lines of 13px/1.45 text plus the shell page's own header and input row,
     * below which it is not a terminal. So the terminal gets a floor and a
     * modest share, and the canvas gets the rest of the viewport: no page
     * max-width (a 1600px cap left a wide screen's margins empty), and a gap
     * and padding of half a rem rather than three quarters.
     */
    #layout {
      display: grid; gap: 0.5rem; padding: 0.5rem;
      height: 100%;
      grid-template-columns: 1fr;
      /* Stacked: the terminal takes a clamped share (never under its 15rem
         floor, never more than 22rem) and the canvas takes ALL the rest,
         shrinking to fit rather than pushing the terminal off the bottom of the
         viewport. height:100% not min-height, so the two of them fit the screen
         instead of making the page scroll to reach the thing you type into. */
      grid-template-rows: auto minmax(0, 1fr) clamp(15rem, 30%, 22rem);
      grid-template-areas: "head" "stage" "term";
    }
    header {
      grid-area: head;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      color: var(--muted); font-size: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
      margin: -0.5rem -0.5rem 0;
    }
    header .brand {
      color: var(--accent); font-size: 14px; font-weight: bold;
      letter-spacing: .12em; text-decoration: none;
    }
    header .brand:hover { text-decoration: underline; }
    /* The two file controls, in the header because that is the one strip of
       the page that is not a canvas: the sheet is GLFW's and the toolbar is a
       node inside it, so a DOM control anywhere else would sit on something
       that is drawn. Styled as the terminal's chrome, not as the toolbar's
       slices -- they are the page's, and the page is monospace on --panel. */
    /* Beside the brand, not in the middle: the header is space-between with
       the status on the right, and margin-right:auto is what keeps the controls
       on the left instead of splitting the difference. */
    header .files { display: flex; align-items: center; gap: 8px; margin-right: auto; }
    header .files input[type=file] { display: none; }
    header .btn {
      color: var(--fg); background: transparent; border: 1px solid var(--line);
      border-radius: 4px; padding: 1px 10px; font: inherit; font-size: 12px;
      line-height: 1.5; cursor: pointer;
    }
    header .btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Canvas fullscreen: the stage (sheet + on-canvas chrome) owns the display;
       header and shell leave with the page layout. ResizeObserver still fires. */
    #stage:fullscreen, #stage:-webkit-full-screen {
      width: 100%; height: 100%;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    #stage:fullscreen canvas#canvas,
    #stage:-webkit-full-screen canvas#canvas {
      width: 100% !important; height: 100% !important;
      border: 0; border-radius: 0; box-shadow: none;
    }

    /* min-height:0 is what lets this box actually shrink -- a grid item
       defaults to min-content, which with a canvas in it means it never
       yields. */
    /* The boot throbber sits over the canvas, centred, and is removed the
       moment the runtime's own picture arrives. pointer-events:none so it
       cannot eat a click during the seconds it is up. */
    #bootthrob {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 5;
    }
    #stage {
      grid-area: stage; min-height: 0; min-width: 0;
      display: flex; align-items: center; justify-content: center;
      position: relative;                 /* the boot throbber anchors to this */
    }
    /* Off the page's picture but on it: 1px, transparent, at the corner, so a
       focus lands and the keyboard comes up without a caret anybody sees. */
    #keys {
      position: absolute; left: 0; bottom: 0; width: 1px; height: 1px;
      opacity: 0; border: 0; padding: 0; resize: none; overflow: hidden;
      font-size: 16px;                    /* under 16px iOS zooms the page on focus */
    }
    #keysbtn {
      display: none; position: absolute; right: 12px; bottom: 12px; z-index: 6;
      width: 56px; height: 56px; border-radius: 28px; font-size: 26px;
      color: var(--fg); background: var(--panel); border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #keysbtn.visible { display: block; }
    /* THE BOX THE RUNTIME IS TOLD ABOUT. The canvas fills this, and
       stageResize() below reads THIS element rather than the canvas -- reading
       the thing you are about to resize is a feedback loop, and the grid area
       is the size that is actually decided by anything. */
    /* THE BOX IS THE STAGE, AND THE FRAMEBUFFER FOLLOWS IT. No aspect ratio.
       It was pinned to 1024/768 for a real reason -- the framebuffer was that
       size and nothing could change it, so any other shape scaled the two axes
       differently, a pointer converted with one factor landed in the wrong
       place, and a box taller than its row was CLIPPED, which is not
       hit-testable, so controls near the bottom stopped answering at some
       window sizes and worked at others.
       What removes the constraint is not a better rule here: it is that the
       window can now be TOLD a size (Window.ResizeTo, WindowProvider) and the
       scene follows it (the layout, boot_paint_panels.etcs). The page observes
       this box and states it; the framebuffer becomes exactly those pixels. So
       the scale is 1:1 on both axes at every shape, which is the condition all
       three of those bugs needed and the aspect ratio was standing in for.
       !important IS STILL LOAD-BEARING. emscripten's GLFW writes an inline
       style on the canvas it owns -- style="width: Npx; height: Npx" -- from
       adjustCanvasDimensions, and an inline declaration outranks a stylesheet
       one. Overriding it keeps the division that should hold: the framebuffer
       is the drawing surface's business, the box is the document's. */
    canvas#canvas {
      display: block; background: #0a0b08;
      border: 1px solid var(--border); border-radius: 6px;
      width: 100% !important; height: 100% !important;
      min-width: 0; min-height: 0;
      box-shadow: -1px -1px 5px rgba(100, 0, 228, 0.7), 1px 1px 5px rgba(0, 0, 255, 0.7);
    }

    /* THE STRIP'S WRAPPER IS GONE, and so is the rule that placed it.
       The toolbar stopped being a second canvas -- it is a CompositeDrawable2D
       inside the sheet now (boot_paint_panels.etcs) -- but `#barwrap` kept
       `grid-area: bar` after `bar` was removed from both grid-template-areas.
       A named area that does not resolve is not ignored: the item is
       auto-placed instead, which ADDS implicit tracks. Measured, the grid
       reported five rows where three are declared
       (31.5px 0px 805.5px 0px 0px), so an empty div was costing two extra
       `gap`s of vertical space in a container that is height:100%. */

    /* SIDE BY SIDE ONCE THERE IS ROOM. Two columns, one row: the canvas takes
       the space the terminal does not need, and both are full height. Below this
       the grid falls back to the stacked rows above, where the terminal's 15rem
       floor applies. The terminal's column is a quarter of the page and never
       under 22rem (308px at the page's 14px): a transcript wraps at any width
       and reads fine wrapped, so the column's floor is what its header and
       input row need, and its share is what the canvas does not lose much to.
       Measured at 1920x1080: the view is 1364x1023 with these rules, against
       the 1024x768 it stopped at before. */
    @media (min-width: 62rem) {
      #layout {
        height: 100%;
        grid-template-columns: minmax(0, 1fr) minmax(22rem, 35%);
        /* THE STRIP IS ITS OWN ROW, and `stage` spans both so the sheet still
           gets the full height of the column beside it. auto rather than a fixed
           height: the strip is a canvas scaled to the column's width, so its
           drawn height follows its aspect ratio and the row follows the canvas
           instead of the other way round. */
        grid-template-rows: auto auto minmax(0, 1fr);
        grid-template-areas: "head head" "stage term" "stage term";
      }
      #shell { min-height: 0; }
    }
    #status.err { color: var(--err); }
    #status.ok  { color: var(--ok); }
    /* The shell page, embedded as the terminal -- the thing you interact with
       for the whole session, so it gets a guaranteed size rather than leftovers. */
    #shell {
      grid-area: term; min-height: 15rem; width: 100%; height: 100%;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--panel);
    }
    /* A SHORT SCREEN IS THE CANVAS'S. A phone on its side is under 30rem tall,
       and the terminal's 15rem floor left the stage a 19px strip; there the
       terminal keeps a 4rem strip (its input line and a line of output) and
       the canvas takes the rest. It scrolls, and it is still there. */
    @media (max-height: 30rem) {
      #layout { grid-template-rows: auto minmax(0, 1fr) 4rem; }
      #shell { min-height: 4rem; }
    }
    /* STACKED (phone / narrow): the default terminal floor is clamp(15rem, 30%,
       22rem), which on a portrait phone is often nearly as tall as the stage.
       Prefer the canvas; keep a usable shell strip without a second column. */
    @media (max-width: 61.99rem) {
      #layout {
        grid-template-rows: auto minmax(0, 1fr) clamp(5.5rem, 16%, 9rem);
      }
      #shell { min-height: 5.5rem; }
    }
    /* Short AND stacked still wins with the 4rem rule above when height is tiny. */
    @media (max-width: 61.99rem) and (max-height: 30rem) {
      #layout { grid-template-rows: auto minmax(0, 1fr) 4rem; }
      #shell { min-height: 4rem; }
    }
    /* Host-side of ShellProvider's output collapse: always STACK the shell under
       the canvas (even on wide desktops) so the stage actually gains the freed
       height. Side-by-side would leave a short terminal column and no extra
       canvas space. */
    #layout.shell-collapsed {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0, 1fr) 4.5rem;
      grid-template-areas: "head" "stage" "term";
    }
    #layout.shell-collapsed #shell {
      min-height: 4.5rem; height: 4.5rem; max-height: 4.5rem;
    }

    /*
     * ── the link ───────────────────────────────────────────────────────────
     *
     * THE BUTTON BECOMES THIS. There is no share dialog any more: a session's
     * whole configuration is a link, so the control that made one turns into
     * the link and the only thing left to do with it is copy it.
     *
     * Monospace and truncated rather than wrapped -- it is an address, it is
     * never read, and a header that grows a second line when you share is a
     * header that moves the canvas.
     */
    #sharelink[hidden] { display: none; }
    #sharelink {
      max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 1px 10px; border: 1px solid var(--accent); border-radius: 4px;
      color: var(--accent); font-size: 12px; cursor: pointer;
    }
    #sharelink:hover { background: rgba(201, 180, 88, 0.12); }
    #sharelink.copied { color: var(--ok); border-color: var(--ok); }
    #sharehue[hidden] { display: none; }
    #sharehue {
      width: 26px; height: 22px; padding: 0; cursor: pointer;
      background: transparent; border: 1px solid var(--line); border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="layout">
    <header>
      <a class="brand" href="/" target="_top">ETCS Paint</a>
      <!-- Images in and out: a PNG/JPEG/BMP/GIF/TGA/PAM file becomes a layer
           or a new canvas (the canvas asks which), and the composite comes back
           as a PNG. The page only moves bytes between the browser and the
           runtime's filesystem; the verbs do the work (see the script below,
           and README.md). -->
      <span class="files">
        <label class="btn" for="upload" title="PNG, JPEG, BMP, GIF, TGA, PAM or PPM -- a new layer or a new canvas">upload</label>
        <input id="upload" type="file" accept=".png,.jpg,.jpeg,.bmp,.gif,.tga,.pam,.ppm,image/png,image/jpeg,image/gif"/>
        <button id="download" class="btn" type="button" title="the visible layers, composited, as PNG">download</button>
        <!-- SHARE, AND THEN THE LINK ITSELF. One control with two states: press
             it to open a session, after which it IS the link and pressing it
             copies. The visitor list opens on the canvas at the same moment,
             and closing that list is what ends the session. -->
        <button id="sharebtn" class="btn" type="button" title="share this canvas -- anyone with the link can watch">share</button>
        <button id="fsbtn" class="btn" type="button" title="fullscreen the canvas (Esc to leave)">fullscreen</button>
        <span id="sharelink" hidden title="click to copy"></span>
        <!-- THE COLOUR YOU ARE SEEN IN. Picked here because it belongs to the
             CLIENT: it is submitted with your viewport in the same call, so
             everyone watching draws your frame in the colour you chose. -->
        <input id="sharehue" type="color" hidden title="the colour your frame is drawn in"/>
      </span>
      <span id="status">loading…</span>
    </header>
    <div id="stage">
      <canvas id="canvas" width="1024" height="768"></canvas>
      <!-- THE BOOT THROBBER, and it is page-side for a measured reason.
           See bootThrobber() below: nothing inside the runtime can draw
           during the window this covers, because the runtime is not
           running yet. -->
      <canvas id="bootthrob" width="96" height="96"></canvas>
      <!-- THE SOFT KEYBOARD'S FIELD. A phone raises its keyboard for a focused
           field and nothing else, and nothing on the canvas is a field: so
           this one, invisible, is focused while the runtime says a box or a
           name is taking keys (PaintRouter::Editing), and what it receives is
           handed on as key presses (PaintRouter::Type). See keyboardBridge(). -->
      <textarea id="keys" autocomplete="off" autocapitalize="off" autocorrect="off"
                spellcheck="false" aria-label="text entry"></textarea>
      <button id="keysbtn" type="button" title="keyboard" aria-label="keyboard">&#9000;</button>
    </div>
    <!-- The ShellProvider page, as the terminal VIEW only. It detects being
         framed and boots no runtime of its own; lines cross by postMessage.
         See README.md for why the runtime is here and the terminal is there.

         THE ONLY TEXT PANE ON THIS PAGE. Boot progress goes here too, through
         the same replay buffer every other line uses -- an ETCS session has one
         log, and splitting the first six lines of it into a second box above the
         terminal meant reading two places to follow one sequence. -->
    <iframe id="shell" src="shell" title="ETCS shell"></iframe>
  </div>

  <script>
(function () {
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  const stageEl = document.getElementById('stage');

  /*
   * FULLSCREEN THE STAGE. Header and shell stay in the document but leave the
   * display; the sheet gets the whole screen and stageResize follows the box.
   * Esc or the same button exits (browser chrome may hide while active).
   */
  (function () {
    const fsBtn = document.getElementById('fsbtn');
    if (!fsBtn || !stageEl) return;
    function fsEl() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }
    function syncFs() {
      const on = fsEl() === stageEl;
      fsBtn.textContent = on ? 'exit full' : 'fullscreen';
      fsBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    fsBtn.addEventListener('click', function () {
      if (fsEl() === stageEl) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document);
        return;
      }
      const req = stageEl.requestFullscreen || stageEl.webkitRequestFullscreen;
      if (!req) {
        log('[etcs] fullscreen is not available in this browser\n', 'err');
        return;
      }
      Promise.resolve(req.call(stageEl)).catch(function (e) {
        log('[etcs] fullscreen: ' + e + '\n', 'err');
      });
    });
    document.addEventListener('fullscreenchange', syncFs);
    document.addEventListener('webkitfullscreenchange', syncFs);
    syncFs();
  })();

  const shellFrame = document.getElementById('shell');

  const ORIGIN = window.location.origin;

  // ── the log ────────────────────────────────────────────────────────────
  //
  // ONE PANE. Boot lines and runtime lines are one sequence, so they go to one
  // place: the terminal. The reason that works even before the iframe can be
  // talked to is the replay buffer below -- `pending` already existed to hold
  // runtime output produced during iframe load, and boot output is the same
  // problem, so it is the same answer rather than a second widget.
  //
  // The header keeps a one-LINE status (the current step, red if it failed), so
  // a page that dies before the terminal can render still says so somewhere
  // that needs no scrolling.
  /*
   * The transcript gets the text AS IT CAME, escapes included -- the terminal
   * view is what renders SGR into colour (ShellProvider's page), and stripping
   * here would throw away the only thing carrying which span means what.
   *
   * The status line is a different medium: it is textContent on one element, so
   * an escape there is bytes on screen rather than a colour. Stripped for that
   * use and only that use.
   */
  const ANSI_STRIP = /\x1b\[[0-9;?]*[A-Za-z]/g;
  /*
   * A LINE FROM THE RUNTIME IS A NOTICE, AND A NOTICE EXPIRES.
   *
   * The status bar shows the last thing worth glancing at; the TERMINAL is what
   * keeps the text. So anything mirrored here out of the log gets a life span,
   * because the alternative is what it used to do: "the room has you as a
   * reader" stayed on the bar after the host had made the page a writer, saying
   * something that had stopped being true and that nothing was ever going to
   * come along and replace -- only an `err` line could write the bar, so the
   * promotion could not clear it even deliberately.
   *
   * Both halves of that are fixed here. `ok` writes the bar too, so a state
   * change can say so; and a mirrored line clears itself.
   *
   * A DIRECT setStatus STILL STICKS. "boot failed", "aborted", "runtime ready"
   * are terminal states of the page rather than notices about the session, and
   * a page that quietly forgets it failed to boot is worse than one that nags.
   */
  const STATUS_TTL_MS = 6000;
  function log(text, cls) {
    termWrite(text);
    if (cls === 'err' || cls === 'ok')
      setStatus(String(text).replace(ANSI_STRIP, '').trim().split('\n')[0],
                cls, STATUS_TTL_MS);
  }
  /*
   * `ttl` clears only what it wrote. Anything that arrived in the meantime is a
   * newer answer to the same question, and expiring somebody else's message is
   * how a bar ends up blank while something is still wrong -- the same "is it
   * still mine" test clearSaid already makes.
   */
  let statusTimer = 0;
  function setStatus(s, cls, ttl) {
    statusEl.textContent = s;
    statusEl.className = cls || '';
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = 0; }
    if (ttl && s) statusTimer = setTimeout(function () {
      statusTimer = 0;
      if (statusEl.textContent === s) setStatus('', '');
    }, ttl);
  }
  // What the bar is showing, if it is showing this. Lets a state change retire
  // the notice that state made stale without clobbering an unrelated one.
  function clearStatusIf(match) {
    if (statusEl.textContent.indexOf(match) !== -1) setStatus('', '');
  }

  // ── the bridge ─────────────────────────────────────────────────────────
  //
  // TEXT OUT, LINES IN, and nothing else crosses. The embedded page is a view:
  // it renders what the runtime printed and hands back what was typed. It holds
  // no runtime state, so there is nothing to keep in sync and no ordering to get
  // wrong -- which is what makes a frame boundary an acceptable place to put it.
  let shellReady = false;
  const pending = [];              // output produced before the view was ready

  function toShell(msg) {
    if (!shellFrame.contentWindow) return;
    shellFrame.contentWindow.postMessage(msg, ORIGIN);
  }

  // Every line the runtime prints. Named on window because that is the hook
  // etcs_web_shell_write already reaches for (loaders/etcs.cc) -- the C++ side
  // calls window.etcsTermWrite when it exists, so wiring it here is what makes
  // the runtime's own writes land in the embedded terminal rather than only in
  // Module.print.
  function termWrite(text) {
    if (!shellReady) { pending.push(text); if (pending.length > 2000) pending.shift(); return; }
    toShell({ etcs: 'out', text: text });
  }

  window.etcsTermWrite = function (t) {
    if (t == null) return;
    termWrite(String(t));
  };


  /*
   * PULLING THE TERMINAL'S OUTPUT, on this page's clock rather than the
   * runtime's.
   *
   * The C++ side accumulates what it writes and hands over whatever has piled
   * up when asked (etcs_web_shell_drain in loaders/etcs.cc). Every line used to
   * cost a cross-thread proxy from whichever thread logged it, a postMessage,
   * and a forced layout in the terminal frame -- several thousand times over a
   * boot. Draining on an interval turns all of that into one call, one message
   * and one reflow per tick.
   *
   * setInterval, not requestAnimationFrame: a hidden tab stops painting frames
   * but the runtime keeps logging, and rAF would leave the buffer to grow until
   * the tab came back. The interval is throttled when hidden, which is the
   * right behaviour -- slower, not stopped.
   *
   * A QUARTER SECOND, not a frame. The tick's cost is per CALL and not per
   * line -- one ccall, one postMessage, one fragment, one reflow -- so a longer
   * window is strictly less work for the same text, and at 60ms a busy boot was
   * still paying that sixteen times a second. 250ms reads as live for a
   * transcript (nobody is timing a log line to the frame) and quarters the
   * number of times the terminal is touched. The runtime's own fallback fires
   * if nothing drains for 750ms, which leaves room for this to be throttled by
   * a background tab without tripping it.
   */
  const SHELL_DRAIN_MS = 250;
  let shellDrainTimer = 0;
  function drainShellOutput() {
    const mod = window.Module;
    if (!mod || !mod.ccall) return;
    let text = '';
    try { text = mod.ccall('etcs_web_shell_drain', 'string', [], []); }
    catch (e) { return; }                 // runtime gone or not exporting it
    if (text) termWrite(text);
    // And the navigator's menu, for the terminal's button view: the runtime is
    // here, the terminal is framed, so the JSON crosses the same way the text
    // does (the shell page's own drain does both in one place).
    let menu = '';
    try { menu = mod.ccall('etcs_web_shell_menu', 'string', [], []); } catch (e) { menu = ''; }
    if (menu && menu !== lastMenuJson) { lastMenuJson = menu; toShell({ etcs: 'menu', json: menu }); }
  }
  let lastMenuJson = '';
  function startShellDrain() {
    if (shellDrainTimer) return;
    shellDrainTimer = setInterval(drainShellOutput, SHELL_DRAIN_MS);
  }

  function pushLine(line) {
    const mod = window.Module;
    if (!mod) { log('[etcs] line dropped, runtime not up: ' + line + '\n', 'err'); return; }
    try {
      // ccall only. The raw export is reached through several names depending on
      // how the build exported it, and trying them in turn is what the shell
      // page used to do -- but ccall does not need the raw symbol at all, so
      // gating on finding one was the bug, not the fallback.
      mod.ccall('etcs_web_shell_push_line', null, ['string'], [line]);
    } catch (e) {
      log('[etcs] push_line failed: ' + e + '\n', 'err');
    }
  }

  /*
   * ── the one thing about the sheet the page still owns ──────────────────
   *
   * THE CONTEXT MENU, and nothing else.
   *
   * It used to be this plus a wheel handler that converted client coordinates
   * into framebuffer pixels and called ZoomBy. That handler is gone, and the
   * reason it could go is worth recording: the wheel was not missing a channel,
   * it was missing an IMPLEMENTOR. ontology/Pointer.h already carried scroll
   * deltas and said in as many words that a device converts to the surface's
   * space once, at its own edge -- so the right fix was for the window to claim
   * Pointer_ and register a GLFW scroll callback, not for the page to do
   * arithmetic GLFW was already doing correctly next door.
   *
   * What is left here genuinely cannot be a verb: the browser opens its own
   * menu on a right press, before anything in the runtime can have an opinion,
   * and right-drag is how the sheet pans.
   */
  canvas.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  function blockMiddleDefault(ev) {
    if (ev.button === 1) ev.preventDefault();
  }
  canvas.addEventListener('mousedown', blockMiddleDefault, { capture: true });
  canvas.addEventListener('mouseup', blockMiddleDefault, { capture: true });
  canvas.addEventListener('auxclick', blockMiddleDefault, { capture: true });
  canvas.addEventListener('pointerdown', blockMiddleDefault, { capture: true });
  canvas.addEventListener('pointerup', blockMiddleDefault, { capture: true });

  /*
   * ── raw images in and out ──────────────────────────────────────────────
   *
   * THE PAGE IS A FILE PROXY HERE, and nothing more. The verbs take a PATH
   * (PaintDocument::ImportImage / ExportImage), so what the page does is what
   * preRun already does for the scripts it boots: put bytes at a name in the
   * runtime's own filesystem, then say the name. Decoding, the new layer and
   * the composite are the document's -- the same lines work from the terminal,
   * and on the desktop the path is a real one. That is why there is no image
   * code on this side and no second copy of anything.
   *
   * Under /uploads and /exports rather than beside the staged scripts, so a
   * file that happens to share a script's name cannot replace it.
   */
  function etcsFS() { return (typeof FS !== 'undefined') ? FS : (window.Module && window.Module.FS); }
  // Set from onRuntimeInitialized below, which is the one signal this page
  // already trusts for "runtime ready". Module.calledRun is not it: with the
  // REPL detached to a worker the main module's run() is not what says the
  // session is up, and reading it here refused every click with the runtime
  // plainly live behind it.
  let runtimeIsUp = false;
  function runtimeUp() { return runtimeIsUp && !!(window.Module && window.Module.ccall); }
  // The boot script's scene has arrived (bootThrobber): every name it spawns
  // is live from here on.
  let sceneUp = false;

  /*
   * ── the soft keyboard ──────────────────────────────────────────────────────
   *
   * A phone shows its keyboard for a focused field, and the canvas has none:
   * a layer being renamed, a page in the list, a text box -- all of them take
   * keys from the window, which on a phone has no keys. So while the runtime
   * says something is taking keys (PaintRouter::Editing, polled), the hidden
   * field is focused and the keyboard is up; when it stops, the field lets
   * go and the keyboard goes.
   *
   * CHARACTERS, NOT KEYS. A soft keyboard's key events carry no code (229,
   * "Unidentified"), so GLFW's window listener -- the path every desktop key
   * takes -- sees nothing to type. What it does deliver is `beforeinput` with
   * the text, and that is handed to the router as presses (PaintRouter::Type).
   * Enter and backspace DO arrive as keys from a soft keyboard, and GLFW takes
   * those, so they are not forwarded here; nor is a character whose keydown
   * carried a real code (a phone with a keyboard attached), or it would type
   * twice. Only on a touch screen (or `?kbd=1`): on a desktop the window's
   * keys are enough and a focused field would be a second listener.
   *
   * FOCUS NEEDS A TOUCH BEHIND IT. A browser raises the keyboard for a focus
   * made during, or shortly after, a tap; a focus made from a timer with no
   * tap behind it is refused on iOS and honoured on Android. The poll runs
   * right after every tap, which covers the tap that opened the box; the
   * button in the corner is for when it did not, and is only shown while
   * something is taking keys.
   */
  const keysEl = document.getElementById('keys');
  const keysBtn = document.getElementById('keysbtn');
  const KEYBOARD_BRIDGE = (function () {
    try { return window.matchMedia('(pointer: coarse)').matches
              || new URLSearchParams(window.location.search).get('kbd') === '1'; }
    catch (e) { return false; }
  })();
  let keysWanted = false, keysPollTimer = 0, glfwTyped = false;
  function focusKeys() {
    try { keysEl.focus({ preventScroll: true }); } catch (e) { try { keysEl.focus(); } catch (_) {} }
  }
  async function pollKeys() {
    if (!runtimeUp() || !nameLive('router')) return;
    const a = await callResult('router', 'Editing', '');
    const wanted = !!a && a.trim() === '1';
    if (wanted === keysWanted) return;
    keysWanted = wanted;
    keysBtn.classList.toggle('visible', wanted);
    if (wanted) focusKeys();
    else if (document.activeElement === keysEl) keysEl.blur();
  }
  function keyboardBridge() {
    if (!KEYBOARD_BRIDGE) return;
    keysPollTimer = setInterval(pollKeys, 250);
    // Right after a tap, too: the tap that opened a box is the gesture the
    // focus needs behind it, and 250ms is too long to wait for it.
    stageEl.addEventListener('pointerup', function () { setTimeout(pollKeys, 60); });
    keysBtn.addEventListener('click', function () { focusKeys(); });
    keysEl.addEventListener('keydown', function (ev) {
      // GLFW has seen this already (window, capture). A real code for a
      // printable is a key it typed; remember, so beforeinput does not too.
      glfwTyped = !!(ev.key && ev.key.length === 1 && ev.keyCode && ev.keyCode !== 229);
    });
    keysEl.addEventListener('beforeinput', function (ev) {
      const type = ev.inputType || '';
      if (type === 'insertText' || type === 'insertCompositionText' || type === 'insertFromPaste') {
        const text = ev.data || '';
        if (text && !glfwTyped && runtimeUp()) callVerb('router', 'Type', text);
      }
      glfwTyped = false;
      // The field never keeps anything: each event is a delta, and a caret
      // nobody sees has nothing to keep.
      ev.preventDefault();
    });
    keysEl.addEventListener('input', function () { keysEl.value = ''; });
  }
  function callVerb(name, work, args) {
    return window.Module.ccall('etcs_web_call', 'number',
                               ['string', 'string', 'string'], [name, work, args]);
  }

  /*
   * ── a call that answers ───────────────────────────────────────────────────
   *
   * etcs_web_call reports whether the NAME was live and nothing about what the
   * verb decided, which is right for a click and useless for a question. The
   * async form runs the call on a pool worker and reaches back through
   * window.__etcs_call_done, and this turns that into an ordinary awaitable --
   * the same wrapper the chess page already carries, for the same reason.
   *
   * ON A WORKER, deliberately: a verb that blocks (and some do) must not block
   * the page's event loop, which is also the thread GLFW delivers every stroke
   * on.
   */
  let __etcsCallSeq = 1;
  const __etcsPending = new Map();
  window.__etcs_call_done = function (handle, ok, text) {
    const p = __etcsPending.get(handle);
    if (!p) return;                 // stale or duplicate; nothing waiting on it
    __etcsPending.delete(handle);
    p.resolve(ok ? text : null);
  };
  function callResult(name, work, args) {
    if (!runtimeUp()) return Promise.resolve(null);
    const handle = __etcsCallSeq++;
    return new Promise(function (resolve) {
      __etcsPending.set(handle, { resolve: resolve });
      window.Module.ccall('etcs_web_call_async', null,
                          ['number', 'string', 'string', 'string'],
                          [handle, name, work, args == null ? '' : args]);
    });
  }

  // IS THAT NAME UP YET, without making a call and without the runtime logging
  // a complaint about it. A boot script's `spawn` is on no clock this side can
  // see, so anything the page wants to state as early as possible has to poll --
  // and polling with a real call printed "is not a live global name" once per
  // attempt, which is a normal wait dressed as an error. See etcs_web_has in
  // loaders/etcs.cc for why the complaint stays loud in the call itself.
  function nameLive(name) {
    try { return !!window.Module.ccall('etcs_web_has', 'number', ['string'], [name]); }
    catch (e) { return false; }     // an older runtime without the probe
  }

  /*
   * ── the window is told how big it is ──────────────────────────────────────
   *
   * A browser has no window manager to drag the frame, so the runtime's window
   * would sit at whatever Create asked for forever and the page had to pin the
   * canvas to its shape. This is the other direction: the page owns the box, so
   * the page states it, and boot_paint_panels.etcs's layout carries it through
   * the scene. `main` is the boot script's own name for the window -- a root
   * script's names are the globals (etcs_web_call).
   *
   * DEBOUNCED, because etcs_web_call runs the whole verb inline on the calling
   * thread, and for a ResizeObserver that is the page's one real main thread.
   * A drag delivers a call per frame; one settled call is what the scene needs
   * and all the main thread should be asked for. The ontology defers its own
   * side as well (RESIZE_SETTLE_FRAMES), so this is the near half of the same
   * argument, not a second policy.
   *
   * CSS PIXELS, NOT DEVICE PIXELS. Framebuffer == box means the pointer maps
   * 1:1 and nothing converts, which is the property the old aspect-ratio pin
   * existed to protect. On a HiDPI screen that costs sharpness and no
   * correctness; multiplying by devicePixelRatio is a later change and has to
   * carry the pointer path with it.
   *
   * THEN RENDER, because a pane that changed size has a stale raster until
   * something redraws it -- the picture's, and the ruler band's, which is drawn
   * by the same call (PaintSurface::Render).
   */
  const STAGE_RESIZE_MS = 120;
  let stageObserver = null, stageTimer = 0, stageW = 0, stageH = 0;
  const COARSE = (function () {
    try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; }
  })();
  /*
   * HOW MUCH BIGGER, and why not simply twice. The toolbar is laid out 640
   * wide and scaled down to fit a narrower framebuffer (README, "What is not
   * solved"), so under 640 it is already as small as the width makes it, and
   * halving the framebuffer would halve it again inside a canvas twice the
   * size -- the same on the screen, with the picture at a quarter of its
   * pixels. So the scale is the width's to give: one at 512 CSS pixels and
   * under (a phone held upright, where only a reflow would help), two at
   * 1024 and over (a tablet), in between in between. A phone on its side
   * lands near 1.7.
   */
  const UI_SCALE = (function () {
    const asked = parseFloat(new URLSearchParams(window.location.search).get('ui'));
    if (asked >= 1 && asked <= 4) return asked;
    if (!COARSE) return 1;
    const w = Math.max(1, window.innerWidth || 1);
    const h = Math.max(1, window.innerHeight || 1);
    // Width-driven scale for finger-sized chrome, but stacked / short viewports
    // already give the stage little height -- dividing that height by 1.5–2
    // leaves the paper a strip under the toolbar. Stay at 1 unless there is
    // both width and height to spend (tablet-class coarse pointers).
    let s = Math.max(1, Math.min(2, w / 512));
    let stacked = false;
    try { stacked = window.matchMedia('(max-width: 61.99rem)').matches; } catch (e) {}
    if (stacked || h < 640) s = 1;
    return s;
  })();

  /*
   * ONE SIZE STATED, AND WHETHER IT LANDED IS THE RETURN VALUE. etcs_web_call
   * answers 1 for dispatched and 0 for "that name does not resolve", which is
   * what a call made before the boot script reached its own `spawn` gets --
   * logged, never retried, and from here indistinguishable from nothing
   * happening. The first call after onRuntimeInitialized is exactly that case:
   * the runtime instance is up, `main` is not a live global yet. So the caller
   * is told, and startStageResize retries until it is.
   */
  function stageResize() {
    if (!runtimeUp()) return false;
    // The window is the boot script's, and this runs before that script has
    // reached its first line. Asking first is what keeps the wait quiet.
    if (!nameLive('main')) return false;
    const box = stageEl.getBoundingClientRect();
    /*
     * THE UI SCALE: on a touch screen the framebuffer is the box at HALF size
     * and the canvas is stretched back over it, so every pane, row and button
     * the boot script lays out in its own pixels is twice as big under a
     * finger, with no script knowing. The pointer path scales with it (GLFW
     * maps a page point through canvas.width / clientWidth), and the picture
     * keeps its own pixels through the zoom. `?ui=<n>` overrides; 1 is the
     * desktop's.
     */
    const w = Math.max(64, Math.round(box.width / UI_SCALE));
    const h = Math.max(64, Math.round(box.height / UI_SCALE));
    if (w === stageW && h === stageH) return true;
    try {
      if (!callVerb('main', 'ResizeTo', w + ', ' + h)) return false;
      /*
       * DISPATCHED IS NOT DONE. etcs_web_call answers whether the NAME
       * resolved and the verb was called -- a window that then declined the
       * size (no handle yet, mid-boot) returns 1 all the same. Recording the
       * size on that answer is how a refused resize became permanent: nothing
       * asks again until the box itself changes, and the box is not going to.
       * The framebuffer is the receipt, so it is what this reads.
       */
      if (canvas.width !== w || canvas.height !== h) return false;
      stageW = w; stageH = h;
      // Not before the scene is up: the window exists from the first lines of
      // the boot script and the canvas from its middle, and a Render sent in
      // between is a warning about a name that is not there yet.
      if (sceneUp) callVerb('canvas', 'Render', '');
      return true;
    } catch (e) {
      log('[etcs] resize to ' + w + 'x' + h + ' failed: ' + e + '\n', 'err');
      return false;
    }
  }

  // Every 150ms for 15s, which is the same shape of wait the first board read
  // uses on the chess page and for the same reason: a boot script's `spawn` is
  // not on any clock this side can see.
  function stageResizeWhenReady(tries) {
    if (stageResize() || tries <= 0) return;
    setTimeout(function () { stageResizeWhenReady(tries - 1); }, 150);
  }

  function startStageResize() {
    if (typeof ResizeObserver === 'function' && !stageObserver) {
      stageObserver = new ResizeObserver(function () {
        clearTimeout(stageTimer);
        stageTimer = setTimeout(stageResize, STAGE_RESIZE_MS);
      });
      stageObserver.observe(stageEl);
    }
    stageResizeWhenReady(100);     // the size we are at, not the one we came up at
  }

  /*
   * WRITING /persist BACK. IDBFS does not write through: a change to a file in
   * it reaches IndexedDB only when syncfs(false) is called. The C++ side says
   * when (PaintPages after every Save, via an `etcs-persist` event), and the
   * page also flushes on pagehide, which is the last moment a closing tab gives
   * it. navigator.storage.persist() is the "may this survive storage pressure"
   * request -- the browser's own file-storage grant -- asked once; a refusal
   * changes nothing here but how long the browser promises to keep it.
   */
  let persistTimer = 0;
  function persistNow(why) {
    const fs = etcsFS();
    if (!fs || !fs.syncfs) return;
    fs.syncfs(false, function (err) {
      if (err) log('[etcs] /persist: write to IndexedDB failed (' + why + '): ' + err + '\n', 'err');
    });
  }
  window.etcsPersist = function (why) {          // reachable from C++ through EM_ASM
    clearTimeout(persistTimer);
    persistTimer = setTimeout(function () { persistNow(why || 'requested'); }, 250);
  };
  window.addEventListener('etcs-persist', function (e) { window.etcsPersist(e.detail); });
  window.addEventListener('pagehide', function () { persistNow('pagehide'); });
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(function (granted) {
      log('[etcs] persistent storage ' + (granted ? 'granted' : 'not granted') + '\n');
    }).catch(function () {});
  }

  const uploadEl = document.getElementById('upload');
  const downloadEl = document.getElementById('download');

  uploadEl.addEventListener('change', async function () {
    const file = uploadEl.files && uploadEl.files[0];
    uploadEl.value = '';                       // so the same file can be chosen twice
    if (!file) return;
    if (!runtimeUp()) { log('[etcs] upload: runtime is not up yet\n', 'err'); return; }
    try {
      const fs = etcsFS();
      const bytes = new Uint8Array(await file.arrayBuffer());
      // The file's name is the layer's (ImportImage takes its stem), kept as
      // given except for what a path cannot carry.
      const path = '/uploads/' + file.name.replace(/[\/\\]/g, '_');
      try { fs.mkdirTree('/uploads'); } catch (e) {}
      fs.writeFile(path, bytes);
      // Offered, not imported: the canvas asks whether the picture is a new
      // layer or a new canvas (PaintCanvasMenu::OfferImport opens the prompt
      // from paint_import.etcs), and acts on the answer -- the render and the
      // layer window's refresh follow from that press, not from here.
      callVerb('menu', 'OfferImport', path);
    } catch (e) {
      log('[etcs] upload failed: ' + e + '\n', 'err');
    }
  });

  // One function, two callers: the header button and the sheet's own menu
  // (below). The export is the same export whichever asked for it.
  function downloadComposite() {
    if (!runtimeUp()) { log('[etcs] download: runtime is not up yet\n', 'err'); return; }
    try {
      const fs = etcsFS();
      const path = '/exports/paint.png';
      try { fs.mkdirTree('/exports'); } catch (e) {}
      try { fs.unlink(path); } catch (e) {}     // a stale file must not pass for this export
      callVerb('doc', 'ExportImage', path);     // says in the terminal if it refused
      const bytes = fs.readFile(path);
      const url = URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
      const a = document.createElement('a');
      a.href = url; a.download = 'paint.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      log('[etcs] download failed: ' + e + '\n', 'err');
    }
  }
  downloadEl.addEventListener('click', downloadComposite);

  /*
   * ── sharing a session ─────────────────────────────────────────────────────
   *
   * THE LINK IS THE RIGHT TO VIEW. There is nothing to type and nobody to
   * admit: press share, the node mints a session id, and that id in a URL is
   * the whole of what a visitor needs. Anyone who opens it is a reader; writing
   * is the one thing the host grants by hand, in the visitor list on the canvas.
   *
   * WHICH MAKES THE ID A SECRET, so nothing here ever puts it anywhere but in
   * the link -- not in the title, not in the terminal, not in a status line
   * somebody screenshots.
   *
   * ONE COUNTER, THE NODE'S. `head` is where this page stands in the node's
   * record -- the `since` of the next read, counted there. What this page has
   * yet to push is not a counter at all: the runtime marks each entry as it
   * goes out (PaintOp::sent), so nothing here has to know how its own notebook
   * is numbered, and nothing goes wrong when that notebook is emptied under a
   * count -- which a Page entry from the room does.
   */
  const SHARE_PUSH_MS = 700;    // how soon after a stroke it leaves this page
  const SHARE_READ_MS = 900;    // how soon somebody else's stroke arrives
  const SHARE_WHO_MS  = 3000;   // the roster is people, and people are slow
  const SHARE_ROLE_MS = 4000;   // how soon a viewer notices it may now write
  const SHARE_VIEW_MS = 1200;   // how soon a pan of yours shows up on their canvas

  const share = {
    base: null, self: null, id: null, token: null, role: null,
    head: 0,
    push: 0, read: 0, who: 0, role_t: 0, view_t: 0,
    sent_view: '',
    busy: false,
    // The record's chain as this page has taken it in (PaintDocument::
    // ImportOps), and the owner's name and last reported (head, picture) --
    // the two checks below (readTheirs, readViews).
    chain: '', owner: '', owner_head: NaN, owner_picture: '', picture: '', picture_at: 0,
    last_head: -1, mismatch: 0, resyncs: 0,
    // Out of step (outOfStep): reading again from the start, how many times
    // since the picture was last the owner's, whether to ask the owner for the
    // page whole, the red line said, and when the owner last sent it whole.
    syncing: false, sync_since: 0, tries: 0, want_page: false, said: '', restated_at: 0
  };

  const shareBtnEl  = document.getElementById('sharebtn');
  const shareLinkEl = document.getElementById('sharelink');
  const shareHueEl  = document.getElementById('sharehue');

  /*
   * A COLOUR THAT ALWAYS WORKS AND CAN STILL BE CHOSEN. Derived from the name
   * so a client that never opens the picker is still distinct from the others,
   * and overridden the moment one is picked -- which persists beside the name,
   * because both are this client's identity in a session rather than the
   * session's property.
   */
  function hueFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    const rgb = [(h * 53) & 255, (h * 97) & 255, (h * 149) & 255];
    // Lifted away from the sheet's own dark so a frame never reads as chrome.
    return '#' + rgb.map(function (v) {
      return (128 + (v >> 1)).toString(16).padStart(2, '0');
    }).join('');
  }
  function myHue() {
    try {
      const kept = window.localStorage.getItem('etcs-paint-hue');
      if (kept) return kept;
    } catch (e) {}
    return hueFor(myName());
  }
  function keepHue(h) {
    try { window.localStorage.setItem('etcs-paint-hue', h); } catch (e) {}
  }

  /*
   * THE NODE THAT SERVED THIS PAGE. A page opened from a laptop, from staging,
   * or from a second site should reach the node on its own origin rather than
   * one typed into the markup months ago -- which is also no CORS question to
   * lose and no hop off the machine. `art` is the mount paint_lobby.etcs uses.
   */
  function defaultNode() { return window.location.origin + '/art'; }

  // A name that survives a reload, because the roster is keyed by it: coming
  // back as somebody else after a refresh means appearing twice in the host's
  // list, once as a ghost. Made up the first time -- two words and a number,
  // which people can say to each other -- and changed from the sharing window
  // (keepName).
  const NAME_A = ['amber', 'brisk', 'calm', 'deep', 'eager', 'fern', 'gold', 'hazy',
                  'ivory', 'jade', 'keen', 'lunar', 'mossy', 'north', 'opal', 'plum',
                  'quiet', 'rusty', 'sly', 'tidal', 'umber', 'vivid', 'wild', 'zesty'];
  const NAME_B = ['otter', 'heron', 'lynx', 'wren', 'moth', 'finch', 'badger', 'newt',
                  'crane', 'fox', 'marten', 'owl', 'raven', 'seal', 'stoat', 'swift',
                  'toad', 'vole', 'yak', 'gecko', 'ibis', 'koi', 'lark', 'mole'];
  function myName() {
    try {
      const kept = window.localStorage.getItem('etcs-paint-name');
      if (kept) return kept;
    } catch (e) {}
    const pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
    const made = pick(NAME_A) + '-' + pick(NAME_B) + '-' + Math.floor(Math.random() * 90 + 10);
    keepName(made);
    return made;
  }
  function keepName(n) {
    try { window.localStorage.setItem('etcs-paint-name', n); } catch (e) {}
  }

  function shareLinkFor(id) { return window.location.origin + window.location.pathname + '?s=' + id; }

  async function nodeGet(path) {
    try {
      const r = await fetch(share.base + '/' + path,
                            { mode: 'cors', cache: 'no-store', credentials: 'omit' });
      return r.ok ? await r.text() : null;
    } catch (e) { return null; }
  }

  async function nodePost(path, body) {
    try {
      // text/plain keeps this a SIMPLE request: anything else preflights, and a
      // preflight is one more thing a node somebody stood up in a hurry has to
      // answer correctly. paint_lobby.etcs answers one anyway; not depending on
      // it is cheaper than depending on it.
      const r = await fetch(share.base + '/' + path, {
        method: 'POST', mode: 'cors', cache: 'no-store', credentials: 'omit',
        headers: { 'Content-Type': 'text/plain' }, body: body
      });
      return r.ok ? await r.text() : null;
    } catch (e) { return null; }
  }

  function tokenPath(verb, arg, arg2) {
    let p = share.self + '/' + share.token + '/' + share.id + '/' + verb;
    if (arg  !== undefined && arg  !== null && arg  !== '') p += '/' + arg;
    if (arg2 !== undefined && arg2 !== null && arg2 !== '') p += '/' + arg2;
    return p;
  }

  /*
   * ── pushing what this page drew ───────────────────────────────────────────
   *
   * ExportOps writes what this page made and has not sent into the runtime's
   * filesystem and the page reads that file back. The file is the bridge
   * because the call bridge is a 256-byte buffer and one stroke is not that --
   * the same reason an imported image crosses as a path, and deliberately the
   * same mechanism. What has been sent is the runtime's to know (PaintOp::
   * sent), so nothing here counts it; a page-level change made here goes as
   * the whole page (PaintDocument::ExportOps).
   */
  /*
   * A PUSH OF ANY SIZE. A request to the node is bounded (64 KB, headers
   * included) and a keyframe is a layer's PNG -- a page with a photograph on it
   * is megabytes -- so anything bigger than one comfortable request goes as
   * numbered parts that the node joins back together before it reads a line
   * (PaintNode's `part` verb). The answer is the last part's, which is the
   * push's.
   */
  const SHARE_PART_CHARS = 48000;
  async function pushText(text) {
    if (text.length <= SHARE_PART_CHARS) return await nodePost(tokenPath('push'), text);
    const n = Math.ceil(text.length / SHARE_PART_CHARS);
    let answer = null;
    for (let i = 0; i < n; i++) {
      answer = await nodePost(tokenPath('part', String(i), String(n)),
                              text.slice(i * SHARE_PART_CHARS, (i + 1) * SHARE_PART_CHARS));
      if (answer === null) return null;
      if (i + 1 < n && answer !== 'more') return answer;     // READ ONLY, or the session went
    }
    return answer;
  }

  /*
   * THE WHOLE PAGE, ONCE, as the session's first entries: its size, its
   * layers and every layer's pixels (PaintDocument::ExportBaseline). Pushing
   * the history from zero instead sent the strokes and not the picture they
   * were made on -- a page loaded from the store, or opened from a file, is
   * pixels no entry describes -- so a joiner saw marks floating on their own
   * paper.
   */
  async function pushBaseline() {
    const fs = etcsFS();
    const path = '/share/out.txt';
    try { fs.mkdirTree('/share'); } catch (e) {}
    try { fs.unlink(path); } catch (e) {}
    callVerb('doc', 'ExportBaseline', path);
    let text = '';
    try { text = new TextDecoder().decode(fs.readFile(path)); } catch (e) { return false; }
    if (!text.trim()) return false;
    const answer = await pushText(text);
    if (answer === null || !/^\d+/.test(answer)) return false;
    /*
     * THE HEAD IS NOT MOVED PAST WHAT WAS PUSHED. It used to be, so a page
     * never read its own lines back -- but the record chain is over every
     * line, so every line has to come back through a read, own ones included.
     * The runtime passes over the page it stated when it comes back
     * (PaintDocument::write_baseline), so the host's own page is not replaced
     * by a copy of itself.
     */
    return true;
  }

  /*
   * The role, and what it does NOT do: it does not stop this page drawing. The
   * room decides who draws -- the node refuses a reader's push -- and a mark
   * the room refused comes off this canvas when the refusal comes back
   * (PaintDocument::RevertPending, pushMine below). Refusing here instead was
   * a second authority that could disagree with the first, and a page that
   * thought it could still draw kept marks nobody else had.
   */
  function setRole(r) {
    share.role = r;
    /*
     * THE ROLE CHANGED, SO WHAT THE ROLE SAID IS NO LONGER TRUE. told_reader is
     * a say-it-once latch (pushMine), and leaving it set after a promotion meant
     * a later demotion went unannounced; leaving the notice on the bar meant the
     * page went on claiming to be a reader while it was drawing. Both are the
     * same mistake -- a statement about a state, kept past the state.
     *
     * Dropped rather than replaced: the promotion has its own line through
     * refreshRole, and two notices about one event is one too many.
     */
    if (r === 'writer' || r === 'owner') {
      share.told_reader = false;
      clearStatusIf('as a reader');
    }
    if (!runtimeUp()) return;
    callVerb('doc', 'SetReadOnly', '0');
    // The sharing window is the role's too: the host's half or a guest's.
    if (r) { callVerb('visitors', 'OpenAs', r); tellWindowWhoIAm(); }
  }

  // The "you" line: the name this page goes by in the room and its colour.
  function tellWindowWhoIAm() {
    if (!runtimeUp() || !share.self) return;
    const hue = (shareHueEl.value || myHue()).replace('#', '');
    callVerb('visitors', 'SetMe', share.self + ', ' + hue);
  }

  async function pushMine() {
    if (share.busy || !share.token || !runtimeUp()) return;
    share.busy = true;
    try {
      const fs = etcsFS();
      const path = '/share/out.txt';
      try { fs.mkdirTree('/share'); } catch (e) {}
      try { fs.unlink(path); } catch (e) {}    // a stale file must not pass for this export
      callVerb('doc', 'ExportOps', path);

      let text = '';
      try { text = new TextDecoder().decode(fs.readFile(path)); } catch (e) { return; }
      if (!text.trim()) return;

      const answer = await pushText(text);
      if (answer === 'NO SUCH SESSION') { leaveSession(); return; }
      /*
       * NOT TAKEN -- refused (this page is a reader, or was just made one) or
       * never answered: what was drawn here is not the room's, so it comes off
       * here. There is no state in which a mark is on this canvas and not in
       * the record for longer than one push takes.
       */
      if (answer === null || answer === 'READ ONLY' || !/^\d+/.test(answer)) {
        callVerb('doc', 'RevertPending', '');
        callVerb('canvas', 'Render', '');
        if (answer === 'READ ONLY' && !share.told_reader) {
          share.told_reader = true;
          log('[etcs] the room has you as a reader -- what you draw here comes back off\n', 'err');
        }
        return;
      }
      share.told_reader = false;
      // The head stays where the last READ put it -- see pushBaseline.
    } finally { share.busy = false; }
  }

  /*
   * ── out of step ───────────────────────────────────────────────────────────
   *
   * THIS PICTURE IS NOT THE ROOM'S: read the record again from its start, and
   * hold the canvas while that lands (PaintDocument::Syncing -- no new stroke,
   * the throbber up). What this page had pending survives the read (the
   * runtime's rewind). A second time without the picture having been the
   * owner's in between means the record will not rebuild it -- a line this
   * runtime cannot read, say -- so this page asks the owner for the page whole
   * (want_page, carried by pushMyView and answered in readViews).
   *
   * The red line goes once the picture is the owner's again (inStep): a
   * warning that stays after it stopped being true teaches you to ignore it.
   */
  function outOfStep(why) {
    share.resyncs++;
    if (++share.tries >= 2) share.want_page = true;
    share.said = '[etcs] ' + why;
    log(share.said + '\n', 'err');
    share.head = 0; share.chain = ''; share.picture = '';
    share.syncing = true; share.sync_since = Date.now();
    callVerb('doc', 'Syncing', '1');
  }

  // The read from the start has landed: the canvas takes strokes again.
  // Bounded, so a room that stopped answering does not hold the canvas.
  function caughtUp() {
    if (!share.syncing) return;
    share.syncing = false;
    if (runtimeUp()) callVerb('doc', 'Syncing', '0');
    if (share.role === 'owner') clearSaid();     // the owner has no picture to compare
  }

  // The picture is the owner's.
  function inStep() {
    share.tries = 0;
    share.want_page = false;
    clearSaid();
  }

  function clearSaid() {
    if (share.said && statusEl.textContent === share.said) setStatus('', '');
    share.said = '';
  }

  /*
   * ── taking in what somebody else drew ─────────────────────────────────────
   *
   * OUR OWN ENTRIES ARE DROPPED ON THE WAY IN. A writer already applied its
   * strokes locally the instant they were made -- the arriving input is what
   * drove the picture -- so the copy coming back from the node would draw every
   * one of them a second time. Filtering by author is what lets local echo and
   * a shared log coexist; the host's copy of a viewer's stroke is not filtered,
   * because the host never drew it.
   */
  async function readTheirs() {
    if (share.busy || !share.token || !runtimeUp()) return;
    share.busy = true;
    try {
      const body = await nodeGet(tokenPath('read', String(share.head)));
      if (body === null) return;
      if (body === 'FORBIDDEN' || body === 'NO SUCH SESSION') {
        // Closed, or we were removed. The canvas stays: it is ours, and it is a
        // copy of the one that was shared.
        log('[etcs] the shared session has ended -- this canvas is yours to keep\n');
        leaveSession();
        return;
      }
      /*
       * THE LAST LINE IS THE NODE'S WORD ON THE RECORD: "= <head> <chain>". Every
       * entry line goes to the runtime, this page's own included -- it chains
       * them all and applies the others' (PaintDocument::ImportOps) -- and what
       * it chained is compared with what the node chained over the same head.
       * Equal heads with different chains is a line this page never took in
       * (or took twice, or out of order), which nothing else can tell from
       * silence: a stroke that never arrived looks exactly like a stroke nobody
       * made. The answer is to start the record again from zero -- the
       * baseline at its head becomes this page's page (PaintDocument::
       * become_page) and everything after it is replayed -- rather than to
       * guess which line went missing.
       */
      const since = share.head;
      const lines = body.split('\n').filter(function (l) { return l.trim().length > 0; });
      let nodeHead = NaN, nodeChain = '';
      const entries = [];
      for (const line of lines) {
        const field = line.split(' ');
        if (field[0] === '=') { nodeHead = parseInt(field[1], 10); nodeChain = field[2] || ''; continue; }
        entries.push(line);
      }
      if (!isNaN(nodeHead)) share.head = Math.max(share.head, nodeHead);
      if (!entries.length) return;

      const fs = etcsFS();
      const path = '/share/in.txt';
      try { fs.mkdirTree('/share'); } catch (e) {}
      fs.writeFile(path, new TextEncoder().encode(entries.join('\n') + '\n'));
      const took = await callResult('doc', 'ImportOps', path + ' ' + since);
      callVerb('canvas', 'Render', '');           // a replayed mark needs showing
      if (took) {
        const f = took.trim().split(' ');         // taken head chain chain-seq unreadable
        share.chain = f[2] || '';
        const chainSeq = parseInt(f[3], 10);
        // A line this runtime cannot read will not read any better from the
        // start: only the page stated whole gets past it.
        if (parseInt(f[4], 10) > 0) share.want_page = true;
        if (nodeChain && share.chain && chainSeq === nodeHead && share.chain !== nodeChain) {
          outOfStep('the record here (' + share.chain + ') is not the room\'s (' + nodeChain
                    + ') at ' + nodeHead + ' -- reading it again from the start');
        } else if (share.syncing && chainSeq === nodeHead && share.chain === nodeChain) {
          caughtUp();
        }
      }
    } finally { share.busy = false; }
  }

  // The roster, straight into the canvas window. Parsed there rather than here:
  // the row is that window's, and the page deciding what a row says would be
  // the page owning a piece of the canvas.
  async function refreshRoster() {
    if (!share.token || !runtimeUp()) return;
    const who = await nodeGet(tokenPath('who'));
    if (who !== null && who !== 'FORBIDDEN' && who !== 'NO SUCH SESSION') {
      callVerb('visitors', 'SetRoster', who);
      for (const line of who.split('\n')) {
        const f = line.trim().split(/\s+/);
        if (f[1] === 'owner') share.owner = f[0];
      }
    }
  }

  // A VIEWER ASKS WHAT IT IS. The host's elevation cannot reach this page --
  // there is no address to reach it at -- so the page asks, on a slow timer,
  // and finds out within a few seconds. Same asymmetry as everything else here.
  async function refreshRole() {
    if (!share.token || share.role === 'owner') return;
    const r = await nodeGet(tokenPath('role'));
    if (r === 'writer' || r === 'reader')
    {
      if (r !== share.role) {
        setRole(r);
        log('[etcs] you are now a ' + r + ' in this session\n', r === 'writer' ? 'ok' : null);
        shareTimers(true);
      }
    }
    else if (r === 'FORBIDDEN' || r === 'NO SUCH SESSION') leaveSession();
  }

  /*
   * ── where I am looking, and where everyone else is ────────────────────────
   *
   * ONE CALL, CARRYING BOTH. The rectangle and the colour are a single
   * statement about how this client should appear; splitting them would let a
   * page be drawn in a stale colour for a poll.
   *
   * SENT ONLY WHEN IT CHANGED. A pan that settles is one request; a pan that is
   * still happening is none, because the rect is read from the runtime each
   * tick and compared to the last one sent. Presence is cheap or it is noise.
   */
  async function pushMyView() {
    if (!share.token || !runtimeUp()) return;
    const rect = await callResult('canvas', 'ViewRect', '');
    if (!rect) return;
    const hue = (shareHueEl.value || myHue()).replace('#', '');
    /*
     * AND WHAT THE PICTURE IS, beside where this page is looking: the record
     * head it has taken in and the hash of what it made of it (PaintDocument::
     * PictureHash). Presence already goes to everyone, so this is how the
     * members compare pictures without a verb for it -- readViews, below.
     */
    // "<hash> <record-seq> <settled>": the picture is sent only when it IS the
    // record's -- nothing of this page's still to be pushed -- and '-' otherwise,
    // which no member compares against.
    const picture = await callResult('doc', 'PictureHash', '');
    const pf = picture ? picture.trim().split(' ') : [];
    share.picture = (pf[2] === '1' && pf[0]) ? pf[0] : '-';
    share.picture_at = parseInt(pf[1], 10);
    // And, last, whether this page needs the owner's page whole (outOfStep).
    const line = rect.trim().replace(/\s+/g, '/') + '/' + hue + '/' + share.picture_at + '/' + share.picture
               + '/' + (share.want_page ? 'R' : '-');
    if (line === share.sent_view) return;          // nothing moved
    share.sent_view = line;
    await nodeGet(tokenPath('view') + '/' + line);
  }

  /*
   * AND THEIRS ONTO THIS CANVAS. ClearPeers then one SetPeer each -- which is
   * the shape the 256-byte call buffer wants, and why no file is involved: a
   * peer line is about forty bytes and one call each stays well under it.
   *
   * The rect arrives in DOCUMENT space and PaintSurface draws it through this
   * pane's own projection, so somebody at a different zoom still has their
   * frame in the right place on the picture.
   */
  async function readViews() {
    if (!share.token || !runtimeUp()) return;
    const body = await nodeGet(tokenPath('views'));
    if (body === null || body === 'FORBIDDEN' || body === 'NO SUCH SESSION') return;
    const lines = body.split('\n').filter(function (l) { return l.trim().length > 0; });
    callVerb('canvas', 'ClearPeers', '');
    for (const line of lines) {
      const f = line.trim().split(/\s+/);
      if (f.length < 6) continue;
      /*
       * THE OWNER'S PICTURE IS THE ROOM'S. A member at the same record head as
       * the owner whose picture hashes differently has diverged -- whatever the
       * chain says it received, what it made of it is not what the owner made
       * -- and it reads the record again from zero (readTheirs). Same head
       * only: a head apart is a stroke in flight, not a divergence. The owner
       * never resyncs to anyone.
       */
      if (f[0] === share.owner && share.role !== 'owner' && f.length >= 8) {
        share.owner_head = parseInt(f[6], 10);
        share.owner_picture = f[7];
        /*
         * ONLY WHEN NOTHING IS MOVING. A stroke being made is in its maker's
         * picture before it is in the record, so pictures at one head differ
         * for a second or two around every stroke; the head then moves. A
         * divergence is a difference that stays while the head does not --
         * two ticks running, with the head where it was.
         */
        const at = share.picture_at;
        const still = share.owner_head === at && at > 0
                   && at === share.last_head
                   && share.picture && share.picture !== '-'
                   && share.owner_picture && share.owner_picture !== '-'
                   && share.picture !== share.owner_picture;
        share.mismatch = still ? share.mismatch + 1 : 0;
        share.last_head = at;
        if (share.owner_head === at && at > 0 && share.picture && share.picture !== '-'
            && share.picture === share.owner_picture) inStep();
        // Three ticks: a settled line can still be a read-back behind the
        // record for a tick or two (pushed, not yet read), and its refresh
        // one more; a difference that outlives that is not in flight.
        if (share.mismatch >= 3) {
          share.mismatch = 0;
          outOfStep('this picture (' + share.picture + ') is not the owner\'s (' + share.owner_picture
                    + ') at ' + at + ' -- reading the record again from the start');
        }
      }
      /*
       * A MEMBER THE RECORD WILL NOT REBUILD asks for the page whole; the
       * owner sends it with the next push (PaintDocument::Restate), at most
       * every twenty seconds, since every member reads what it sends.
       */
      if (share.role === 'owner' && f[8] === 'R' && Date.now() - share.restated_at > 20000) {
        share.restated_at = Date.now();
        callVerb('doc', 'Restate', '');
        log('[etcs] ' + f[0] + ' cannot rebuild this page from the record -- sending it whole\n');
      }
      const hex = f[5].replace('#', '');
      if (hex.length < 6) continue;
      const r = parseInt(hex.slice(0, 2), 16) / 255;
      const g = parseInt(hex.slice(2, 4), 16) / 255;
      const b = parseInt(hex.slice(4, 6), 16) / 255;
      callVerb('canvas', 'SetPeer',
               f[0] + ', ' + f[1] + ', ' + f[2] + ', ' + f[3] + ', ' + f[4]
               + ', ' + r.toFixed(3) + ', ' + g.toFixed(3) + ', ' + b.toFixed(3));
    }
    callVerb('canvas', 'Render', '');
  }

  async function tickPresence() {
    if (share.syncing && Date.now() - share.sync_since > 15000) caughtUp();
    await pushMyView();
    await readViews();
  }

  function shareTimers(on) {
    clearInterval(share.push); clearInterval(share.read);
    clearInterval(share.who);  clearInterval(share.role_t);
    clearInterval(share.view_t);
    share.push = share.read = share.who = share.role_t = share.view_t = 0;
    if (!on) return;
    share.view_t = setInterval(tickPresence, SHARE_VIEW_MS);
    share.read = setInterval(readTheirs, SHARE_READ_MS);
    // Every member pushes: the node is what says who may draw (pushMine).
    share.push = setInterval(pushMine, SHARE_PUSH_MS);
    share.who = setInterval(refreshRoster, SHARE_WHO_MS);
    if (share.role !== 'owner') share.role_t = setInterval(refreshRole, SHARE_ROLE_MS);
  }

  function leaveSession() {
    shareTimers(false);
    share.token = null; share.id = null;
    share.head = 0;
    share.chain = ''; share.owner = ''; share.picture = ''; share.owner_picture = '';
    caughtUp(); inStep();
    setRole(null);                      // editable again: the canvas is theirs now
    if (runtimeUp()) {
      callVerb('doc', 'SetAuthor', '');
      callVerb('visitors', 'Hide', '');           // idempotent; already shut is fine
    }
    shareLinkEl.hidden = true;
    shareHueEl.hidden = true;
    shareBtnEl.hidden = false;
    shareBtnEl.textContent = 'share';
    share.sent_view = '';
    if (runtimeUp()) { callVerb('canvas', 'ClearPeers', ''); callVerb('canvas', 'Render', ''); }
  }

  function showLink() {
    shareLinkEl.textContent = shareLinkFor(share.id);
    shareLinkEl.hidden = false;
    shareHueEl.hidden = false;
    shareBtnEl.hidden = true;
  }

  /*
   * PRESSING SHARE OPENS THE SESSION AND THE VISITOR LIST TOGETHER, because
   * they are the same act: the list being up IS the statement that this canvas
   * is shared, and closing it is the statement that it is not.
   */
  async function startHosting() {
    if (!runtimeUp()) { log('[etcs] share: the runtime is not up yet\n', 'err'); return; }
    share.base = defaultNode();
    share.self = myName();

    const answer = await nodeGet(share.self + '/open');
    if (answer === null) { log('[etcs] share: no answer from ' + share.base + '\n', 'err'); return; }
    const bits = answer.trim().split(' ');
    if (bits.length < 2) { log('[etcs] share: ' + answer + '\n', 'err'); return; }

    share.id    = bits[0];
    share.token = bits[1];
    setRole('owner');
    share.head  = 0;
    callVerb('doc', 'SetAuthor', share.self);

    // THE PICTURE AS IT STANDS, so a session opened on a canvas that is
    // already painted starts from that picture rather than from the next stroke.
    if (!(await pushBaseline())) log('[etcs] share: the page could not be sent -- joiners start blank\n', 'err');

    showLink();
    await refreshRoster();
    shareTimers(true);
    log('[etcs] sharing -- the link in the header is the invitation\n', 'ok');
  }

  // Arriving on somebody's link. No knocking and nothing to wait for: holding
  // the id is the right to view, so this is a join and then a read.
  async function joinFromLink(id) {
    if (!runtimeUp()) return;
    share.base = defaultNode();
    share.self = myName();

    /*
     * THE TOKEN IS THIS TAB'S, so it is kept per tab (sessionStorage) and
     * handed back on a reload; a fresh tab has none and is a new member. The
     * name is only what this page ASKS for -- every tab of one browser reads
     * the same stored name, and the node grants a free one (suffixed when
     * taken), which is the name this page then goes by: as the author of what
     * it pushes, and as the author it passes over on the way back in. Two tabs
     * that both believed they were the host dropped every one of its lines.
     */
    let had = '';
    try { had = window.sessionStorage.getItem('etcs-paint-token-' + id) || ''; } catch (e) {}
    const answer = await nodeGet(share.self + '/join/' + id + (had ? '/' + had : ''));
    if (answer === null || answer === 'NO SUCH SESSION') {
      log('[etcs] that share link is not open any more\n', 'err');
      return;
    }
    const bits = answer.trim().split(' ');
    share.id    = id;
    share.token = bits[0];
    if (bits[2]) share.self = bits[2];
    try { window.sessionStorage.setItem('etcs-paint-token-' + id, share.token); } catch (e) {}
    share.head  = 0;                    // from the beginning: give us the picture
    share.chain = '';

    /*
     * WHAT WAS ON THIS CANVAS IS PUT AWAY FIRST, into the page store, and the
     * canvas leaves its slot (PaintPages::Stash) -- so the session's page,
     * which replaces the document when it arrives, is a new page rather than
     * an overwrite of theirs. Then the role, which may make it view only.
     */
    const kept = await callResult('pages', 'Stash', '');
    if (kept && kept.trim() === 'ok') log('[etcs] your page is kept in the page list\n');
    setRole(bits[1] || 'reader');
    callVerb('doc', 'SetAuthor', share.self);

    // The sharing window opens for a guest too (setRole): their name, their
    // colour and who else is here, without the host's buttons.
    shareLinkEl.textContent = 'in a shared canvas';
    shareLinkEl.hidden = false;
    shareHueEl.hidden = false;        // a viewer picks their colour too
    shareBtnEl.hidden = true;

    await readTheirs();
    await refreshRoster();
    shareTimers(true);
    log('[etcs] joined a shared canvas as ' + share.self + ', a ' + share.role
        + ' -- the sharing window has your name and colour\n', 'ok');
  }

  shareHueEl.value = myHue();
  shareHueEl.addEventListener('change', function () {
    keepHue(shareHueEl.value);
    share.sent_view = '';          // force the next tick to state the new colour
    tellWindowWhoIAm();
  });

  shareBtnEl.addEventListener('click', function () {
    if (!share.token) startHosting();
  });

  shareLinkEl.addEventListener('click', function () {
    if (!share.id) return;
    const text = shareLinkFor(share.id);
    const done = function () {
      shareLinkEl.classList.add('copied');
      setTimeout(function () { shareLinkEl.classList.remove('copied'); }, 1200);
    };
    // The modern path needs a secure context and permission; the fallback is
    // the one that has always worked. Both, because a share link nobody can
    // copy is a share button that does nothing.
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(done).catch(function () { selectFallback(text, done); });
    else selectFallback(text, done);
  });

  function selectFallback(text, done) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); done();
    } catch (e) { log('[etcs] could not copy the link: ' + text + '\n', 'err'); }
  }

  /*
   * THE VISITOR LIST TALKING BACK. PaintVisitors cannot reach the node -- a
   * fetch is the page's -- so a press on a row raises this and the page
   * performs the verb. "close" is the one that ends the session, which is why
   * closing that window is the whole gesture for stopping a share.
   */
  window.addEventListener('etcs-visitors', async function (ev) {
    const what = (ev && ev.detail) || '';
    if (!share.token) return;
    if (what === 'close') {
      await nodeGet(tokenPath('close'));
      leaveSession();
      log('[etcs] sharing ended -- everyone keeps the canvas they have\n');
      return;
    }
    if (what === 'leave') {
      leaveSession();
      log('[etcs] you left the shared canvas -- this canvas is yours to keep\n');
      return;
    }
    if (what === 'copy') { shareLinkEl.click(); log('[etcs] link copied: ' + shareLinkFor(share.id) + '\n'); return; }
    if (what.startsWith('hue:')) {
      const hex = '#' + what.slice(4).replace(/[^0-9a-f]/gi, '').slice(0, 6);
      shareHueEl.value = hex;
      keepHue(hex);
      share.sent_view = '';        // the next presence tick carries it
      tellWindowWhoIAm();
      return;
    }
    if (what.startsWith('name:')) {
      /*
       * A NEW NAME IS THE NODE'S TO GRANT: the roster is keyed by it, so one
       * somebody else has is refused. Granted, it is this page's from then on
       * -- kept for the next visit, and the author of what it pushes.
       */
      const want = what.slice(5);
      const got = await nodeGet(tokenPath('rename', encodeURIComponent(want)));
      if (got === 'TAKEN') log('[etcs] somebody here is already called ' + want + '\n', 'err');
      else if (got && got !== 'BAD NAME' && got !== 'FORBIDDEN' && got !== 'NO SUCH SESSION') {
        share.self = got.trim();
        keepName(share.self);
        callVerb('doc', 'SetAuthor', share.self);
        log('[etcs] you are ' + share.self + ' in this session\n', 'ok');
      }
      tellWindowWhoIAm();
      await refreshRoster();
      return;
    }
    const colon = what.indexOf(':');
    if (colon < 0) return;
    const verb = what.slice(0, colon), who = what.slice(colon + 1);
