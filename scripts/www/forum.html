<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48x48.png">
<link rel="icon" href="/favicon/favicon.ico">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
<link rel="manifest" href="/favicon/site.webmanifest">
<title>ACE Forum</title>
<style>
  :root { --light:#e8e2d5; --sel:#c9b458; --ink:#1c1c1a;
          --bg:#14150f; --panel:#1b1c14; --line:#3b3d31; --dim:#8d907c;
          --ok:#8fbf7a; --warn:#d4a24f; --bad:#d4674f; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--light);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
           padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  .brand { color:var(--sel); letter-spacing:.12em; text-decoration:none; }
  .spacer { flex:1; }
  input, button, textarea { font:inherit; font-size:12px; background:var(--panel);
                  color:var(--light); border:1px solid var(--line); padding:5px 8px; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { background:var(--sel); color:var(--ink); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--sel); color:var(--ink); }
  #me { background:none; border:none; padding:2px 4px; color:var(--sel);
        cursor:pointer; font:inherit; letter-spacing:.04em; }
  #me:hover { text-decoration:underline; background:none; color:var(--sel); }
  #record, #lock { color:var(--dim); font-size:11px; }
  main { padding:20px 16px; max-width:900px; margin:0 auto; }
  .hidden { display:none !important; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .grow { flex:1; min-width:0; }
  h3 { margin:0 0 6px; font-weight:normal; color:var(--dim); font-size:12px;
       letter-spacing:.1em; text-transform:uppercase; }
  table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  th { text-align:left; color:var(--dim); font-weight:normal; font-size:11px;
       letter-spacing:.08em; text-transform:uppercase;
       border-bottom:1px solid var(--line); padding:6px 8px; }
  td { padding:7px 8px; border-bottom:1px solid #24261c;
       overflow:hidden; text-overflow:ellipsis; }
  tr:hover td { background:#1e1f16; }
  .key { color:var(--sel); }
  .empty { color:var(--dim); padding:12px 8px; font-size:12px; }
  .cols { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .cols > div { flex:1 1 320px; min-width:0; }

  /* A post. The hashes are shown, always, not tucked behind a details pane:
     the head is the only thing a reader can check this server WITH, so hiding
     it would leave a forum that merely claims to be verifiable. */
  .post { border-bottom:1px solid #24261c; padding:10px 8px; }
  .post .meta { color:var(--dim); font-size:11px; display:flex; gap:10px;
                flex-wrap:wrap; align-items:baseline; }
  .post .who { color:var(--sel); }
  .post .body { margin-top:6px; white-space:pre-wrap; word-break:break-word; }
  .post.tomb .body { color:var(--dim); font-style:italic; }
  .hash { color:#5f6350; font-size:10px; user-select:all; }
  #head { color:var(--warn); font-size:11px; user-select:all; }
  #chainline { font-size:11px; padding:6px 8px; border:1px solid var(--line);
               margin-bottom:12px; }
  .st-ok { color:var(--ok); } .st-bad { color:var(--bad); } .st-warn { color:var(--warn); }
  #say { width:100%; min-height:64px; resize:vertical; }
  .link { color:var(--dim); font-size:11px; user-select:all; }
</style>
</head>
<body>
<header>
  <a href="/" class="brand">ACE FORUM</a>
  <button id="me" title="back to the index">-</button>
  <span id="record"></span>
  <span id="lock"></span>
  <span class="spacer"></span>
  <input id="rename" placeholder="name" size="12">
  <button id="renameBtn">set</button>
  <button id="verifyBtn" title="recompute every hash on the server and report">verify</button>
</header>

<main>
  <!-- index -->
  <section id="home">
    <div class="bar">
      <input id="newTitle" class="grow" placeholder="new thread title">
      <button id="newBtn" class="primary">open thread</button>
    </div>
    <div class="cols">
      <div>
        <h3>threads</h3>
        <table><thead><tr>
          <th style="width:22%">title</th><th style="width:14%">posts</th>
          <th style="width:14%">here</th><th style="width:34%">head</th><th style="width:16%"></th>
        </tr></thead><tbody id="threads"></tbody></table>
        <div id="threadsEmpty" class="empty">nothing here yet.</div>
      </div>
      <div>
        <h3>anons</h3>
        <table><thead><tr>
          <th>name</th><th>posts</th><th>threads</th><th>idle</th>
        </tr></thead><tbody id="selves"></tbody></table>
      </div>
    </div>
  </section>

  <!-- one thread -->
  <section id="thread" class="hidden">
    <div class="bar">
      <button id="back">&larr; index</button>
      <span id="ttitle" class="key grow"></span>
      <button id="lockBtn">lock</button>
    </div>
    <div id="chainline"></div>
    <div id="posts"></div>
    <div class="bar" style="margin-top:14px">
      <textarea id="say" placeholder="say something (max 512 bytes, one line)"></textarea>
    </div>
    <div class="bar">
      <button id="sayBtn" class="primary">post</button>
      <span id="sayNote" class="empty"></span>
      <span class="spacer"></span>
      <span id="tlink" class="link"></span>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const MOUNT = 'forum';
const qs = new URLSearchParams(location.search);

// ── Identity ─────────────────────────────────────────────────────────────────
// A client-generated token in a cookie, exactly as the chess client does. The
// server answers Connection: close, so nothing on the wire outlives a fetch and
// there is nothing stable to bind a name to. Once a post lands the server marks
// this name LOCKED and we disable rename here -- not because the server could
// stop us, but because the name is already written into a hash chain and
// changing it would leave the old one in the record permanently.
const COOKIE = 'ace_forum_name';
function cookie(k) {
  const m = document.cookie.match('(^|;)\\s*' + k + '\\s*=\\s*([^;]+)');
  return m ? decodeURIComponent(m.pop()) : '';
}
function setCookie(k, v) {
  document.cookie = k + '=' + encodeURIComponent(v) + ';path=/;max-age=31536000;samesite=lax';
}
let TOKEN = cookie(COOKIE);
if (!TOKEN) {
  TOKEN = 'anon' + Math.random().toString(36).slice(2, 8);
  setCookie(COOKIE, TOKEN);
}
let LOCKED = false;

// ── The wire ─────────────────────────────────────────────────────────────────
// Every response opens with a cursor header line:
//   @.    tail, nothing follows
//   @+N   resume at N, this chunk ended on a whole line
//   @~N   resume at N, this chunk was cut MID-LINE, concatenate
// The header is unconditional, so reassembly is "strip line one, follow N".
// Byte-exact: what comes back from a full walk is what a single unbounded
// response would have been.
const enc = s => encodeURIComponent(s);
const url = (...seg) => '/' + MOUNT + '/' + seg.filter(x => x !== '' && x != null).map(enc).join('/');

async function fetchText(u) { const r = await fetch(u); return await r.text(); }

// Walk a windowed read to completion. `guard` is a hard stop rather than a
// while(true): a server that returned a cursor pointing backwards would
// otherwise spin the tab forever, and a truncated read is a better failure than
// a hung one.
async function walk(base) {
  let out = '', cur = '', guard = 0;
  while (guard++ < 400) {
    const chunk = await fetchText(cur === '' ? base : base + '/' + cur);
    const nl = chunk.indexOf('\n');
    if (nl < 0) { out += chunk; break; }
    const hdr = chunk.slice(0, nl);
    out += chunk.slice(nl + 1);
    if (hdr === '@.' || hdr[0] !== '@') break;
    const next = hdr.slice(2);
    if (!/^\d+$/.test(next)) break;
    cur = next;
  }
  return out;
}
const lines = t => t.split('\n').map(l => l.trimEnd()).filter(Boolean);

// ── State ────────────────────────────────────────────────────────────────────
let room = qs.get('t') || '';
let lastHead = '';
let timer = null;

function show(which) {
  $('home').classList.toggle('hidden', which !== 'home');
  $('thread').classList.toggle('hidden', which !== 'thread');
}

function go(t) {
  room = t || '';
  const q = room ? ('?t=' + enc(room)) : '';
  history.replaceState(null, '', location.pathname + q);
  lastHead = '';
  refresh();
}

// ── Index ────────────────────────────────────────────────────────────────────
// Line shape: "<tkey> <posts> <here> <open|locked> <head16> <title...>"
// Title is last because it is the only field that can contain spaces, so it is
// rejoined rather than indexed.
async function loadIndex() {
  const ls = lines(await walk(url('index')));
  const tb = $('threads'); tb.innerHTML = '';
  $('threadsEmpty').classList.toggle('hidden', ls.length > 0);
  for (const line of ls) {
    const p = line.split(/\s+/);
    if (p.length < 5) continue;
    const [tkey, posts, here, state] = p, head = p[4];
    const title = p.slice(5).join(' ');
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="key"></td><td></td><td></td><td class="hash"></td><td></td>';
    tr.children[0].textContent = title === '-' ? tkey : title;
    tr.children[1].textContent = posts;
    tr.children[2].textContent = here;
    tr.children[3].textContent = head;
    const b = document.createElement('button');
    b.textContent = state === 'locked' ? 'read' : 'open';
    b.onclick = () => go(tkey);
    tr.children[4].appendChild(b);
    tb.appendChild(tr);
  }

  const sl = lines(await walk(url('selves')));
  const sb = $('selves'); sb.innerHTML = '';
  for (const line of sl) {
    const p = line.split(/\s+/);
    if (p.length < 5) continue;
    const tr = document.createElement('tr');
    for (let i = 0; i < 4; i++) {
      const td = document.createElement('td');
      td.textContent = i === 0 ? p[0] : p[i === 3 ? 4 : i];
      if (i === 0 && p[0] === TOKEN) td.className = 'key';
      tr.appendChild(td);
    }
    sb.appendChild(tr);
  }
}

// ── One thread ───────────────────────────────────────────────────────────────
// Render shape:
//   #<tkey> <title> <op> open|locked <n> <head16> <readers>
//   <seq> <author> <made> <chash16> <ihash16> <body>
// A tombstoned post keeps its line and its BOTH hashes, with "!tomb" where the
// body was. That is deliberate and shown as such: the chain still verifies
// across a removal, so the reader can see that content of a known hash was here
// and is gone -- which is a different claim from "nothing was ever here".
async function loadThread() {
  const text = await walk(url(TOKEN, room, 'read'));
  const ls = lines(text);
  if (!ls.length || ls[0][0] !== '#') { $('posts').innerHTML =
      '<div class="empty">thread not found.</div>'; return; }

  const h = ls[0].slice(1).split(/\s+/);
  const title = h[1], op = h[2], state = h[3], head = h[5], here = h[6];
  $('ttitle').textContent = (title === '-' ? room : title) + '  (' + room + ')';
  $('tlink').textContent = location.origin + '/?t=' + room;
  $('lockBtn').textContent = state === 'locked' ? 'unlock' : 'lock';
  $('lockBtn').disabled = (op !== TOKEN);

  // The head, and whether it moved for a reason. A head that changes with no
  // new posts to explain it is the one thing this client can catch on its own,
  // without holding the thread and without trusting the server to report it.
  const n = +h[4];
  const cl = $('chainline');
  if (lastHead && lastHead !== head && n === lastCount) {
    cl.innerHTML = '<span class="st-bad">head moved with no new post: ' +
      lastHead + ' &rarr; ' + head + '</span>';
  } else {
    cl.innerHTML = '<span class="st-ok">head</span> <span id="hd">' + head +
      '</span> &middot; ' + n + ' posts &middot; ' + here + ' here &middot; ' +
      (state === 'locked' ? '<span class="st-warn">locked</span>' : 'open');
  }
  lastHead = head; lastCount = n;

  const box = $('posts'); box.innerHTML = '';
  for (let i = 1; i < ls.length; i++) {
    const p = ls[i].split(/\s+/);
    if (p.length < 6) continue;
    const [seq, who, made, chash, ihash] = p;
    const body = ls[i].split(/\s+/).slice(5).join(' ');
    const tomb = body === '!tomb';
    const d = document.createElement('div');
    d.className = 'post' + (tomb ? ' tomb' : '');
    const meta = document.createElement('div'); meta.className = 'meta';
    const w = document.createElement('span'); w.className = 'who'; w.textContent = who;
    const when = document.createElement('span');
    when.textContent = new Date((+made) * 1000).toLocaleString();
    const hs = document.createElement('span'); hs.className = 'hash';
    hs.textContent = '#' + seq + ' c:' + chash + ' i:' + ihash;
    meta.append(w, when, hs);
    if (!tomb && (who === TOKEN || op === TOKEN)) {
      const rm = document.createElement('button');
      rm.textContent = 'tomb'; rm.style.fontSize = '10px';
      rm.title = 'remove the content; the record that it was here stays';
      rm.onclick = async () => { await fetchText(url(TOKEN, room, 'tomb', seq)); refresh(); };
      meta.appendChild(rm);
    }
    const b = document.createElement('div'); b.className = 'body';
    b.textContent = tomb ? 'removed \u2014 content hash ' + chash : body;
    d.append(meta, b);
    box.appendChild(d);
  }
  $('sayBtn').disabled = (state === 'locked');
  $('sayNote').textContent = state === 'locked' ? 'thread is locked.' : '';
}
let lastCount = -1;

// ── Identity strip ───────────────────────────────────────────────────────────
async function loadMe() {
  const p = (await fetchText(url(TOKEN, 'me'))).trim().split(/\s+/);
  if (p.length < 5) return;
  $('me').textContent = TOKEN;
  $('record').textContent = p[1] + ' posts in ' + p[2] + ' threads';
  LOCKED = (p[3] === 'locked');
  $('lock').textContent = LOCKED ? 'name locked by a post' : '';
  $('rename').disabled = LOCKED;
  $('renameBtn').disabled = LOCKED;
}

async function refresh() {
  try {
    await loadMe();
    if (room) { show('thread'); await loadThread(); }
    else      { show('home');   await loadIndex(); }
  } catch (e) { /* a dropped poll is not worth a visible error */ }
}

// ── Actions ──────────────────────────────────────────────────────────────────
$('me').onclick   = () => go('');
$('back').onclick = () => go('');

$('renameBtn').onclick = () => {
  const v = $('rename').value.trim();
  if (!v || LOCKED) return;
  TOKEN = v.slice(0, 48); setCookie(COOKIE, TOKEN);
  $('rename').value = ''; refresh();
};

$('newBtn').onclick = async () => {
  const t = $('newTitle').value.trim();
  const r = (await fetchText(url(TOKEN, 'new', t || 'untitled'))).trim();
  $('newTitle').value = '';
  if (/^t\d+$/.test(r)) go(r); else refresh();
};

$('lockBtn').onclick = async () => { await fetchText(url(TOKEN, room, 'lock')); refresh(); };

$('sayBtn').onclick = async () => {
  const t = $('say').value.trim();
  if (!t) return;
  $('say').value = '';
  // Newlines are flattened to spaces server-side; say so rather than letting
  // the user discover it after posting.
  const r = (await fetchText(url(TOKEN, room, 'post', t))).trim();
  if (r.indexOf('OK ') !== 0) $('sayNote').textContent = r;
  refresh();
};

$('verifyBtn').onclick = async () => {
  const out = lines(await walk(url('verify')));
  const bad = out.filter(l => l.indexOf(' BAD ') > 0);
  alert(bad.length
    ? 'FAILED on ' + bad.length + ' thread(s):\n\n' + bad.join('\n')
    : 'every content hash and every chain link recomputed clean:\n\n' + out.join('\n'));
};

// Polling, not a socket. HTTP gives no disconnect signal, so presence is
// inferred from traffic and every poll is a heartbeat -- which is also what
// keeps this self alive and what the "here" counts are counting.
refresh();
timer = setInterval(refresh, 3000);
</script>
</body>
</html>
