<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACE Chess</title>
<style>
  :root { --light:#e8e2d5; --dark:#7a8a6f; --sel:#c9b458; --ink:#1c1c1a;
          --bg:#14150f; --panel:#1b1c14; --line:#3b3d31; --dim:#8d907c;
          /* One square, from which the whole board derives. min() rather than a
             media query because the constraint is arithmetic, not a device
             class: 8 squares plus padding must fit the narrower of the viewport's
             width and height, and 64px is simply the cap on a large screen.
             Breakpoints would have to guess at the sizes this computes. */
          --sq: min(64px, calc((100vw - 28px) / 8), calc((100vh - 222px) / 8)); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--light);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
           padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  .brand { color:var(--sel); letter-spacing:.12em; text-decoration:none; }
  .spacer { flex:1; }
  input, button { font:inherit; font-size:12px; background:var(--panel);
                  color:var(--light); border:1px solid var(--line); padding:5px 8px; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { background:var(--sel); color:var(--ink); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--sel); color:var(--ink); }
  /* the identity, as a way HOME rather than as decoration */
  #me { background:none; border:none; padding:2px 4px; color:var(--sel);
        cursor:pointer; font:inherit; letter-spacing:.04em; }
  #me:hover { text-decoration:underline; background:none; color:var(--sel); }
  #record { color:var(--dim); font-size:12px; }
  #lock { color:var(--dim); font-size:11px; }
  main { padding:20px 16px; }
  .hidden { display:none !important; }

  #home { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }
  #home { max-width:820px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:20px; }
  #home table { table-layout:fixed; }
  #home td, #home th { overflow:hidden; text-overflow:ellipsis; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  h3 { margin:0 0 6px; font-weight:normal; color:var(--dim); font-size:12px;
       letter-spacing:.1em; text-transform:uppercase; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--dim); font-weight:normal; font-size:11px;
       letter-spacing:.08em; text-transform:uppercase;
       border-bottom:1px solid var(--line); padding:6px 8px; }
  td { padding:7px 8px; border-bottom:1px solid #24261c; }
  tr:hover td { background:#1e1f16; }
  .key { color:var(--sel); }
  .st-waiting{color:var(--dim);} .st-playing{color:#8fbf7a;}
  .st-checkmate,.st-stalemate,.st-draw,.st-resign-white,.st-resign-black{color:#d4a24f;}
  .full { color:#d4674f; }
  .link { color:var(--dim); font-size:11px; user-select:all; }
  .empty { color:var(--dim); padding:12px 8px; font-size:12px; }
  /* Wrap by content, not by breakpoint: the children are allowed to grow but
     never to shrink below a table's own readable width, so when two of them no
     longer fit they stack instead of squeezing. flex-basis carries the minimum
     rather than min-width, because a media query later sets min-width:0 and
     would otherwise cancel it -- which is exactly what made the players table
     sit on top of the join button.
     Note that flex-basis:100% below is what forces the stack outright, so no
     arithmetic has to be right for it to be usable. */
  .cols { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .cols > div { flex:1 1 300px; min-width:0; }

  #game { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
  .col { display:flex; flex-direction:column; gap:10px; }
  #board { display:grid; grid-auto-flow:row;
           grid-template-columns:repeat(8,var(--sq));
           grid-template-rows:repeat(8,var(--sq));
           border:3px solid var(--line); box-shadow:0 10px 40px #0008; }
  .sq { display:flex; align-items:center; justify-content:center;
        /* Glyph tracks the square rather than being a second number to keep in
           sync -- 0.68 keeps a piece inside its square at every size. */
        font-size:calc(var(--sq) * 0.68);
        line-height:1; user-select:none; cursor:pointer; }
  .sq.light{background:var(--light);} .sq.dark{background:var(--dark);}
  .sq.sel { outline:3px solid var(--sel); outline-offset:-3px; }
  .sq span { color:var(--ink); text-shadow:0 1px 0 #fff6; }
  .sq.b span { color:#16160f; text-shadow:0 1px 0 #8886; }
  /* Two soft pulses, then a steady low glow. The pulses are what catch the eye
     when a move lands while you were looking somewhere else; the glow is what
     answers "where was it again?" thirty seconds later. A pure animation that
     ended at nothing would lose the second job, and the stationary version this
     replaces never did the first -- an opponent's move on a quiet board simply
     changed colour with nothing to draw the eye to it.
     The 0/100% frames deliberately match .sq.last's own box-shadow so the
     settle is continuous rather than a step. */
  .sq.last { box-shadow: inset 0 0 10px 2px #70500080; }
  .sq.flash { animation: lastflash 1.15s ease-in-out 1 both; }
  @keyframes lastflash {
    0%   { box-shadow: inset 0 0 10px  2px #70500080; }
    18%  { box-shadow: inset 0 0 22px  7px #d9b45cf0; }
    40%  { box-shadow: inset 0 0 10px  2px #70500060; }
    62%  { box-shadow: inset 0 0 22px  7px #d9b45cf0; }
    100% { box-shadow: inset 0 0 10px  2px #70500080; }
  }
  @media (prefers-reduced-motion: reduce) { .sq.flash { animation:none; } }

  /* Review mode. Greyed as ONE surface rather than square by square: what is
     being said is "this whole board is not the live one", and a per-square
     treatment reads as a highlight -- the opposite meaning, and already spoken
     for by .sel and .last. filter also greys the piece glyphs, which a
     background swap could not, so the light squares stay light relative to the
     dark ones and the position remains readable while unmistakably inert.
     No banner over the board: the grey, the forward/live buttons that appear
     beside the status line, and the status text itself already say it three
     times, and a fourth in a strip across the board covered the back rank. */
  #board.review { filter:grayscale(1) brightness(.62) contrast(.9); }
  /* Pointer-events off, not just a cursor change: the click handler already
     refuses in review, but a board that visibly accepts clicks and then says no
     is worse than one that does not respond. */
  #board.review { pointer-events:none; }
  /* The bar and the board are one object, so they are wrapped in a column of
     their own: .col carries gap:10px, which would otherwise float the bar ten
     pixels off the board it belongs to. width:max-content makes the wrapper
     take the board's width rather than the column's, which is what lets the
     bar's border line up with the board's own 3px frame. */
  #boardwrap { display:flex; flex-direction:column; width:max-content; max-width:100%; }
  /* Chrome, so it is sized like chrome: the bar is the board's frame with
     controls in it, not a row of its own. Height comes from the buttons, so
     they carry the shrink -- 1px of padding and a 10px glyph put the whole bar
     at roughly half what a default-sized button forced, and nothing here is
     read for long enough to need 12px.
     flex-wrap is deliberately OFF: wrapping would silently double the height
     it is the point of this rule to keep down, and the row is five short
     buttons that fit inside eight squares at every size the board reaches. */
  #boardbar { display:flex; align-items:center; gap:2px; flex-wrap:nowrap;
              padding:1px 3px; background:var(--panel);
              border:3px solid var(--line); border-bottom-width:0; }
  #boardbar button { padding:0 5px; font-size:9px; line-height:1.45;
                     letter-spacing:.02em; }
  /* The arrow glyphs render small at 10px next to Latin text, so they get their
     own size -- matching the visual weight rather than the point size, which is
     what makes a mixed row of glyphs and words look level. */
  #boardbar button#rw-first, #boardbar button#rw-back,
  #boardbar button#rw-fwd,   #boardbar button#rw-last { font-size:10px; padding:0 5px; }
  /* Pushed to the far end, so the buttons stay put as the text appears and
     disappears instead of shunting sideways each time review is entered. */
  #ply { color:var(--dim); font-size:9px; margin-left:auto; padding-left:8px;
         white-space:nowrap; }
  #status { min-height:1.4em; letter-spacing:.04em; }
  #status.review { color:var(--sel); }
  #status.review { color:var(--sel); }
  #status.bad { color:#d4674f; }
  #fen { font-size:11px; color:var(--dim); word-break:break-all; max-width:520px; }
  #role { color:var(--sel); font-size:12px; }
  /* Fixed width forced a horizontal scrollbar on a phone even after the board
     scaled: the flex row could wrap, but a 270px child cannot shrink below its
     own width without min-width:0. */
  #chat { width:100%; max-width:340px; min-width:0; height:min(300px, 32vh);
          overflow-y:auto; background:var(--panel); border:1px solid var(--line);
          padding:8px; font-size:12px; white-space:pre-wrap; }
  /* Narration, dimmed. Same column as speech deliberately -- "bob sits as
     black" is only worth reading next to what bob then said -- but never
     mistakable for it, because the server marks its own lines and the client
     is the only thing that decides how a marked line looks. */
  #chat .sys { color:var(--dim); font-style:italic; }
  #chat .sys::before { content:'· '; }
  #say  { width:100%; max-width:340px; min-width:0; }
  #game .col { min-width:0; max-width:100%; }
  #fen { max-width:100%; }
  main { overflow-x:hidden; }
  /* Tables are the other fixed-ish thing: the Link column holds a full URL and
     will not wrap on its own. */
  td.link { word-break:break-all; }
  @media (max-width:560px) {
    /* The shareable URL is the first thing worth dropping -- it is the widest
       column and the least useful on a phone, where sharing goes through the
       system share sheet rather than by selecting text. */
    #mine th:nth-child(5), #mine td:nth-child(5) { display:none; }
    header { gap:8px; font-size:12px; }
    /* One column per row below this width. flex-basis:100% is unconditional --
       it does not depend on the 300px estimate being right for any particular
       device, it simply says a full row each. */
    .cols > div { flex:1 1 100%; }
  }

  .veil { position:fixed; inset:0; display:none; align-items:center;
          justify-content:center; background:#0009; z-index:10; }
  .veil.on { display:flex; }
  .veil .box { display:flex; gap:6px; padding:16px; background:var(--panel);
               border:1px solid var(--line); box-shadow:0 10px 40px #000a; }
  #over .box { flex-direction:column; gap:14px; padding:24px 32px; text-align:center; }
  #over h2 { margin:0; font-size:20px; font-weight:normal; letter-spacing:.06em; color:var(--sel); }
  #over p { margin:0; color:var(--dim); font-size:12px; }
  #promo button { width:64px; height:64px; font-size:42px; background:var(--light); color:var(--ink); }
</style>
</head>
<body>

<header>
  <a href="/" class="brand">ACE CHESS</a>
  <!-- The identity is the way HOME: your name is your lobby, so clicking it
       goes to your own self rather than to some separate "menu" page. -->
  <button id="me" title="Go to your lobby">—</button>
  <span id="record"></span>
  <span id="lock"></span>
  <input id="rename" size="10" placeholder="rename" title="Pick a name — locks once you have a result">
  <span class="spacer"></span>
  <span id="here" class="link"></span>
  <button id="to-home" class="hidden">&larr; my lobby</button>
</header>

<main>
  <section id="home">
    <div class="bar">
      <button id="quick" class="primary">Quick play</button>
      <input id="new-room" class="grow" placeholder="or name a match, e.g. friday-night">
      <button id="make">Open match</button>
      <button id="refresh">Refresh</button>
    </div>

    <div>
      <h3>My games</h3>
      <table><thead><tr><th>Match</th><th>Opponent</th><th>Here</th><th>State</th><th>Link</th><th></th></tr></thead>
      <tbody id="mine"></tbody></table>
      <div id="no-mine" class="empty">no games yet — quick play finds you an opponent</div>
    </div>

    <div class="cols">
      <div>
        <h3>All matches on this node</h3>
        <table><thead><tr><th>Match</th><th>Here</th><th>Seats</th><th>State</th><th></th></tr></thead>
        <tbody id="rooms"></tbody></table>
        <div id="no-rooms" class="empty">none open</div>
      </div>
      <div>
        <h3>Players</h3>
        <table><thead><tr><th>Name</th><th>W</th><th>L</th><th>D</th><th>Games</th><th>Idle</th></tr></thead>
        <tbody id="players"></tbody></table>
        <div id="no-players" class="empty">nobody yet</div>
      </div>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="col">
      <!-- A chrome bar ATTACHED to the board: same width, flush against its top
           edge, sharing its border, so it reads as part of the board rather
           than as buttons that happen to sit near it. Deliberately a general
           board toolbar and not a review widget -- flip, copy PGN, a clock all
           belong here later, which is why it is #boardbar with the review
           controls grouped inside it rather than #review.
           Back is always offered; forward, first, last and "live" only exist
           once there is something to go forward TO, so the bar carries one
           glyph in the ordinary case and grows only while in use. -->
      <div id="boardwrap">
        <div id="boardbar">
          <button id="rw-first" class="hidden" title="first position (Home)">&#x23EE;</button>
          <button id="rw-back" title="back one move (←)">&#x25C0;</button>
          <button id="rw-fwd" class="hidden" title="forward one move (→)">&#x25B6;</button>
          <button id="rw-last" class="hidden" title="latest position (End)">&#x23ED;</button>
          <button id="rw-live" class="hidden primary" title="return to the live board (Esc)">Live</button>
          <span id="ply"></span>
        </div>
        <div id="board"></div>
      </div>
      <div id="status">connecting…</div>
      <div class="bar" id="controls">
        <button id="resign">Resign</button>
        <button id="draw">Offer draw</button>
        <span id="offer" class="link"></span>
      </div>
      <div id="fen"></div>
    </div>
    <div class="col">
      <div id="role">role: —</div>
      <div id="chat"></div>
      <input id="say" placeholder="say something, enter to send" maxlength="80">
    </div>
  </section>
</main>

<div id="promo" class="veil"><div class="box"></div></div>
<div id="over" class="veil"><div class="box">
  <h2 id="over-title">Game over</h2><p id="over-sub"></p>
  <button id="over-new" class="primary">New game</button>
</div></div>

<script>
const $ = id => document.getElementById(id);
const MOUNT = 'game';
const qs = new URLSearchParams(location.search);

// ── Identity ─────────────────────────────────────────────────────────────────
// A client-chosen name, NOT a connection: the server answers Connection: close,
// so every fetch is its own connection and nothing on the wire outlives a single
// request. The name is what makes "this side is mine" and "this record is mine"
// mean anything across requests -- and it is the slot a signed ACE key drops
// into later, the same thing a peer would present with no server at all.
//
// Stored in a COOKIE rather than only localStorage: a cookie has an explicit
// lifetime we can state (a year), it survives across the whole origin, and it is
// the same channel that would carry a real credential later. localStorage is
// still read once, to migrate anyone who already has a token from before.
function setCookie(k, v, days) {
  document.cookie = k + '=' + encodeURIComponent(v) +
                    '; path=/; max-age=' + (days * 86400) + '; SameSite=Lax';
}
function getCookie(k) {
  const m = document.cookie.match('(^|;)\\s*' + k + '\\s*=\\s*([^;]+)');
  return m ? decodeURIComponent(m[2]) : null;
}
const COOKIE = 'ace_chess_name';

let TOKEN = qs.get('as')                      // explicit override, for testing
         || getCookie(COOKIE)                  // the durable one
         || localStorage.getItem('ace_chess_token')   // migrate the old store
         || ('anon-' + Math.random().toString(36).slice(2, 7));
setCookie(COOKIE, TOKEN, 365);

let room    = qs.get('room') || null;   // the match id, null == home
// Consumed once. The URL is an ENTRY VECTOR, not state: syncUrl rewrites it on
// every navigation, so a stale ?room left in qs kept being read back after
// returning home and the client went on polling a room it had left.
qs.delete('room');
let locked  = false;                    // name locked by a recorded result

// /<mount>/<self>/<match>/<verb>[/<arg>] -- SELF first, because that is the
// segment that becomes implicit when the request arrives at your own machine:
// a peer's own URL is just /<match>/<verb>.
const api    = (verb, arg) => '/' + MOUNT + '/' + TOKEN + '/' + room + '/' + verb +
                              (arg ? '/' + encodeURIComponent(arg) : '');
const mine   = (verb, arg) => '/' + MOUNT + '/' + TOKEN + '/' + verb +
                              (arg ? '/' + encodeURIComponent(arg) : '');
const nodeUrl = verb       => '/' + MOUNT + '/' + verb;
const matchUrl = m => location.origin + location.pathname + '?room=' + encodeURIComponent(m);

async function get(u) { return (await (await fetch(u)).text()); }
const lines = t => t.split('\n').map(l => l.trim()).filter(Boolean);

// ── The local game cache ─────────────────────────────────────────────────────
// Positions survive a refresh, so reopening a game does not re-fetch a history
// the browser already had. localStorage rather than a cookie, despite the cache
// being conceptually the same idea: a cookie is sent on EVERY request, and this
// page polls two or three times a second, so a few kilobytes of position data
// would ride along on each one -- onto a server whose replies we have just
// spent this change keeping under a frame. Cookies also cap around 4KB for the
// whole origin, which is about fifty plies; localStorage is megabytes and never
// touches the wire.
//
// This is also the shape the WASM/P2P version wants. Once ChessProvider runs in
// the page there is no fetch to avoid, but there IS a local record of the game
// that must outlive a reload, and it is this one -- the store stops being a
// cache of someone else's history and becomes the client's own copy, which is
// what a peer holds by definition.
const CACHE_PREFIX = 'ace_chess_hist:';
const CACHE_MAX    = 600;      // plies kept per match, matching the server's ring
let cacheKey=null, cacheDirty=false, cacheTimer=0;

function cacheLoad(match){
  cacheKey = CACHE_PREFIX + match;
  try{
    const raw = localStorage.getItem(cacheKey);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(!o || o.v!==1 || !o.p) return;
    for(const k in o.p){
      const l=o.p[k], sp=l.indexOf(' ');
      if(sp<0) continue;
      const fen=l.slice(sp+1);
      if(!isFen(fen)) continue;
      histMap.set(+k, {uci:l.slice(0,sp), fen:fen});
    }
    histBase = o.b|0;
    histEnd  = Math.max(histEnd, o.e|0);
    // histSynced is deliberately NOT restored. The cache says what this browser
    // last saw, which is a claim about the past; whether it is still the CURRENT
    // game is a question only the server can answer, and syncEnd asks it before
    // the cache is allowed to decide how far back the arrow may go.
  }catch(e){}
}

function cacheSave(){
  if(!cacheKey) return;
  try{
    let keys=[...histMap.keys()].sort((a,b)=>a-b);
    if(keys.length>CACHE_MAX) keys=keys.slice(keys.length-CACHE_MAX);
    const p={};
    for(const k of keys){ const h=histMap.get(k); p[k]=h.uci+' '+h.fen; }
    localStorage.setItem(cacheKey, JSON.stringify({v:1,b:histBase,e:histEnd,p:p}));
  }catch(e){
    // Quota, or storage disabled outright (private windows, embedded views).
    // The cache is an optimisation; losing it costs requests, not correctness.
    try{ localStorage.removeItem(cacheKey); }catch(_){}
  }
}

// Coalesced: a live game touches the map on every move, and a game being walked
// backwards touches it once per fetched block. Writing through on each would
// serialise the whole map several times a second for no benefit.
function cacheTouch(){
  cacheDirty=true;
  if(cacheTimer) return;
  cacheTimer=setTimeout(()=>{ cacheTimer=0; if(cacheDirty){ cacheDirty=false; cacheSave(); } }, 1500);
}
function cacheFlush(){ if(cacheDirty){ cacheDirty=false; cacheSave(); } }

function cacheDrop(){
  cacheDirty=false;
  if(cacheTimer){ clearTimeout(cacheTimer); cacheTimer=0; }
  if(cacheKey) try{ localStorage.removeItem(cacheKey); }catch(e){}
}

// ── Board ────────────────────────────────────────────────────────────────────
const GLYPH = { K:'\u2654',Q:'\u2655',R:'\u2656',B:'\u2657',N:'\u2658',P:'\u2659',
                k:'\u265A',q:'\u265B',r:'\u265C',b:'\u265D',n:'\u265E',p:'\u265F' };
const boardEl=$('board'), statusEl=$('status'), fenEl=$('fen'),
      roleEl=$('role'), chatEl=$('chat'), sayEl=$('say');
let squares=[], selected=null, lastFen='', myRole='viewer', myTurn=false,
    flipped=false, overShown='';

// ── Review state ─────────────────────────────────────────────────────────────
// The game as POSITIONS, keyed by the SERVER's absolute ply index -- 0 is the
// position the game started from -- and the key is what survives the server's
// ring dropping its oldest plies, which a plain array's indices would not.
//
// Positions rather than moves because rendering a past state must not require
// replaying one: the client has no engine, and re-deriving move twelve from
// twelve applications of a move it cannot validate would put a second, weaker
// rules implementation in the browser.
//
// SPARSE, and filled backwards on demand. A ply line is a uci plus a FEN, so
// only a handful fit in one reply and a whole game is always many -- pulling
// all of it the first time anyone touches the back arrow would be a burst of
// requests to show one position. The map holds what this client watched happen;
// stepping back past that point fetches the block it landed in and keeps it.
const HIST_BLOCK = 8;          // how far back one fetch reaches
let histMap = new Map();       // absolute ply index -> {uci, fen}
let histBase = 0;              // oldest index the server still holds
let histEnd  = 0;              // one PAST the newest known index (0 == unknown)
let ply=-1;                    // -1 == live. Otherwise an absolute index.
let histSynced=false;          // has the end been agreed with the server

// squares[] stays in FEN order -- 0 is a8, 63 is h1 -- so draw() walks a FEN
// straight into it with no notion of orientation. Flipping is CSS `order`, not a
// reordered array: otherwise every index in draw() would have to know the
// orientation, and data-alg (the true square) would drift from the clicked cell.
for (let y=0;y<8;y++) for (let x=0;x<8;x++) {
  const d=document.createElement('div');
  d.className='sq '+((x+y)%2?'dark':'light');
  d.dataset.alg='abcdefgh'[x]+(8-y);
  d.dataset.idx=y*8+x;
  d.onclick=()=>clickSquare(d);
  boardEl.appendChild(d); squares.push(d);
}
function applyOrientation(){ for(const d of squares) d.style.order = flipped?(63-+d.dataset.idx):+d.dataset.idx; }
applyOrientation();

// Only black flips; a viewer keeps white's view, the conventional default.
function orientFor(role){ const w=(role==='black'); if(w===flipped) return; flipped=w; applyOrientation(); }

// A FEN's placement field is eight '/'-separated ranks. Anything else is a
// status string -- ILLEGAL, NOT FOUND, GAME OVER, BUSY -- and must be SHOWN, not
// parsed: handing one to draw() throws inside the renderer and swallows the
// message, which is the one thing needed to diagnose it.
const isFen = s => typeof s==='string' && s.split(' ')[0].split('/').length===8;

function draw(fen){
  const rows=fen.split(' ')[0].split('/'); let i=0;
  for(let y=0;y<8;y++) for(const ch of rows[y]){
    if(ch>='1'&&ch<='8'){ for(let k=0;k<+ch;k++) set(squares[i++],''); }
    else set(squares[i++],ch);
  }
  fenEl.textContent=fen;
}
function set(sq,ch){
  sq.innerHTML = ch ? '<span>'+GLYPH[ch]+'</span>' : '';
  sq.classList.toggle('b', ch && ch===ch.toLowerCase());
}
function flash(m){ statusEl.textContent=m; statusEl.className='bad'; }

function clickSquare(sq){
  if(!room) return;
  // Belt and braces with the pointer-events rule in CSS: the click cannot
  // arrive today, but the guard is what makes the invariant true in the code
  // rather than in a stylesheet a later change could relax.
  if(ply>=0){ flash('reviewing — press Live to move'); return; }
  // A viewer whose side is still open may try: attempting IS the claim. Only
  // someone actually refused a seat is locked out.
  if(myRole!=='viewer' && !myTurn){ flash('not your turn'); return; }
  if(!selected){ selected=sq; sq.classList.add('sel'); return; }
  const from=selected.dataset.alg, to=sq.dataset.alg;
  const glyph=selected.textContent, isBlack=selected.classList.contains('b');
  selected.classList.remove('sel'); selected=null;
  if(from===to) return;
  // Promotion cannot be completed client-side: the engine answers PROMOTE and
  // WAITS for a piece, so a bare four-character move leaves the board
  // mid-transaction.
  const isPawn = glyph===GLYPH.P||glyph===GLYPH.p;
  if(isPawn && to[1]===(isBlack?'1':'8')){ askPromotion(from+to,isBlack); return; }
  move(from+to);
}

const PROMO=[['q','Q','q'],['r','R','r'],['b','B','b'],['n','N','n']];
const promoEl=$('promo');
function askPromotion(uci,black){
  const box=promoEl.firstElementChild; box.innerHTML='';
  for(const [letter,w,b] of PROMO){
    const btn=document.createElement('button');
    btn.textContent=GLYPH[black?b:w];
    btn.onclick=()=>{ promoEl.classList.remove('on'); move(uci+letter); };
    box.appendChild(btn);
  }
  promoEl.classList.add('on');
}
promoEl.onclick=ev=>{ if(ev.target===promoEl) promoEl.classList.remove('on'); };

function clearLast(){
  for(const e of boardEl.querySelectorAll('.last,.flash')) e.classList.remove('last','flash');
}
// pulse=true replays the two flashes. Off by default because stepping through
// history re-marks a square several times a second, and a strobing board is
// not what "here is the move" should feel like -- the pulse is reserved for a
// move actually LANDING.
function highlightLast(to, pulse){
  clearLast();
  const sq = boardEl.querySelector('[data-alg="'+to+'"]');
  if(!sq) return;
  sq.classList.add('last');
  if(!pulse) return;
  // Reflow between remove and add, or re-adding the class inside the same frame
  // is a no-op and the second move to the same square never flashes.
  void sq.offsetWidth;
  sq.classList.add('flash');
}

async function move(uci){
  try{
    const t=(await get(api('move',uci))).trim();
    if(t==='ILLEGAL') flash(uci+' — illegal');
    else if(t==='NOT YOUR TURN') flash('not your turn');
    else if(t==='NOT YOUR SEAT') flash('both seats taken — you are watching');
    else if(t==='GAME OVER') flash('this game is finished');
    else if(isFen(t)){
      statusEl.className=''; lastFen=t; noteLive(uci,t);
      draw(t); highlightLast(uci.slice(2,4),true); await refreshStatus();
    }
    else flash('server said: '+(t||'(empty)'));
  }catch(e){ flash('move failed: '+e); }
}

// Verbs that answer with a status line rather than a FEN.
async function verb(name){
  try{
    const t=(await get(api(name))).trim();
    if(t==='NOT YOUR SEAT'||t==='GAME OVER'){ flash(t.toLowerCase()); return; }
    await refreshStatus();
  }catch(e){ flash(name+' failed: '+e); }
}
$('resign').onclick=()=>{ if(confirm('Resign this game?')) verb('resign'); };
$('draw').onclick=()=>verb('draw');

// ── Review: stepping back through the game ───────────────────────────────────
// Reviewing is a purely LOCAL mode. Nothing is sent, no seat is affected, and
// polling carries on underneath -- so a player can look at move six while their
// opponent thinks, and be returned to a live board that is already up to date
// the moment they press Live. That is why lastFen keeps being updated while
// ply>=0 and only draw() is suppressed: the live position is never stale, it is
// merely not the one on screen.
// Where the live position sits, read off the FEN: fullmove number and side to
// move ARE a ply counter, so the client can address "how far from the start"
// without asking anyone. Used only to AIM the first request -- the reply's own
// header is what indices are trusted from afterwards, so a game seeded with
// loadFen (whose fullmove does not start at 1) costs an extra page rather than
// reading the wrong plies.
function plyFromFen(fen){
  const f=fen.split(' ');
  const full=parseInt(f[5],10);
  if(!isFinite(full)||full<1) return 0;
  return (full-1)*2 + (f[1]==='b'?1:0);
}

// A position watched arriving. Once the end is agreed, every landed move is
// simply the next index, so no estimate is involved after the first sync.
function noteLive(uci,fen){
  const idx = histSynced ? histEnd : plyFromFen(fen);
  const have = histMap.get(idx);
  if(have && have.fen===fen) return;      // a poll re-seeing the same position
  histMap.set(idx,{uci:uci||'-', fen:fen});
  histEnd = Math.max(histEnd, idx+1);
  cacheTouch();
}

function histRow(l){
  const sp=l.indexOf(' ');
  if(sp<0) return null;
  const r={uci:l.slice(0,sp), fen:l.slice(sp+1).trim()};
  return isFen(r.fen) ? r : null;
}

// One page, merged in. The reply's first line sits at max(from, base) because
// the server clamps a cursor that has fallen behind its ring, so THAT is the
// index the lines are keyed from -- not the requested from.
async function loadPage(from){
  const t = await get(api('history', String(Math.max(0,from))));
  if(!t) return null;
  const p = parsePage(t);
  // Unpaged server: the whole list arrives at once, keyed from zero.
  if(!p){
    let i=0;
    for(const l of lines(t)){ const r=histRow(l); if(r) histMap.set(i++, r); }
    if(i){ histBase=0; histEnd=Math.max(histEnd,i); histSynced=true; cacheTouch(); }
    return null;
  }
  histBase = p.base;
  let i = Math.max(from, p.base);
  for(const l of p.lines){
    const r=histRow(l);
    if(r){
      // The server disagreeing with a cached position means the cache is from a
      // DIFFERENT game -- the match was reset while this browser was away, and
      // the indices now point at somebody else's moves. Throw the local copy
      // out entirely rather than keeping a board that is half one game and half
      // another; the server is the only thing that knows which is current.
      const had=histMap.get(i);
      if(had && had.fen!==r.fen){
        histMap.clear(); cacheDrop();
        histEnd=0;
      }
      histMap.set(i, r);
    }
    i++;
  }
  histEnd = Math.max(histEnd, p.next);
  cacheTouch();
  return p;
}

// Agree with the server on where the game ends, once per visit. Aimed with the
// FEN's own ply count, so the ordinary case is a SINGLE request: asking from the
// live index returns that one line and a next of index+1, which is the total.
// An estimate that overshoots is clamped and still answers with the total; only
// one that undershoots pages forward, and that is bounded.
//
// Run even when the cache already claims to know the end, because that claim is
// about the game as it was last seen. This is the request that catches a reset.
async function syncEnd(){
  if(histSynced || histBusy || !room) return;
  histBusy=true;
  try{
    let from = lastFen ? plyFromFen(lastFen) : 0;
    let serverEnd = 0;
    for(let guard=0; guard<200; guard++){
      const p = await loadPage(from);
      if(!p) break;                       // unpaged server, or a dead reply
      serverEnd = Math.max(serverEnd, p.next);
      if(!p.lines.length || p.next<=from) break;
      from = p.next;
    }
    // The end the server reports REPLACES the cached one, rather than being
    // maxed with it. A cache can legitimately hold plies the server has since
    // dropped off the front of its ring -- that is the whole point of keeping
    // it -- but it can never hold plies BEYOND the server's end, because that
    // would mean the game got shorter, and a game only gets shorter by being
    // reset. Comparing positions cannot catch that on its own: a reset game
    // starts from the same opening position as the one it replaced, so index 0
    // agrees perfectly while every index after it belongs to a dead game.
    if(serverEnd>0 && serverEnd<histEnd){
      for(const k of [...histMap.keys()]) if(k>=serverEnd) histMap.delete(k);
      histEnd = serverEnd;
      if(ply>=histEnd) ply=-1;
      cacheTouch();
    }
    histSynced = histEnd>0;
  }catch(e){}finally{ histBusy=false; }
}

// Make sure index i is in hand. Asks for i ITSELF: a page runs FORWARD from the
// cursor, so requesting i is the one request guaranteed to contain it, whereas
// aiming a block behind it and paging forward costs a request per couple of
// plies before arriving. Being right about which request to make matters more
// here than fetching a lot in one go.
async function ensureIndex(i){
  if(i<0 || histMap.has(i)) return histMap.has(i);
  if(histBusy) return false;
  histBusy=true;
  try{ await loadPage(i); }catch(e){}finally{ histBusy=false; }
  return histMap.has(i);
}

// Warm the plies BEHIND the one being shown, off the critical path. A page
// carries a couple of entries forward, so stepping back two at a time covers
// the range with no gaps. Nothing awaits this: the position the user asked for
// is already on the board, and this only decides whether the NEXT click waits.
let prefetching=false;
async function prefetchBack(i){
  if(prefetching) return;
  prefetching=true;
  try{
    const floor=Math.max(histBase, i-HIST_BLOCK);
    for(let j=i-1, n=0; j>=floor && n<6; j-=2, n++){
      if(histBusy) break;                       // a real click wants the wire
      if(histMap.has(j) && histMap.has(j+1)) continue;
      await loadPage(j);
    }
  }catch(e){}finally{ prefetching=false; }
}

function reviewUi(){
  const on=(ply>=0), last=histEnd-1;
  $('rw-fwd').classList.toggle('hidden',!on);
  $('rw-first').classList.toggle('hidden',!on);
  $('rw-last').classList.toggle('hidden',!on);
  $('rw-live').classList.toggle('hidden',!on);
  // Before the end is agreed, "no earlier position" is not something the client
  // knows: a spectator arriving at move thirty has one snapshot and twenty-nine
  // plies waiting on the server. Greying the button out on that reading would
  // hide the feature from exactly the people who need it, so it stays live
  // until a sync has established there is nothing there.
  $('rw-back').disabled = on ? (ply<=histBase) : (histSynced && histEnd<2);
  $('rw-fwd').disabled  = on && ply>=last;
  $('rw-first').disabled= on && ply<=histBase;
  $('rw-last').disabled = on && ply>=last;
  $('ply').textContent = on ? (ply+' / '+last) : '';
  boardEl.classList.toggle('review',on);
}

// async: the position may not be in hand, and fetching it is the point. The
// board is left exactly as it was until the position IS in hand, so a fetch
// that fails changes nothing rather than blanking it.
async function showPly(i){
  const want=Math.max(histBase,Math.min(histEnd-1,i));
  if(!histMap.has(want)){
    $('ply').textContent='loading…';
    if(!await ensureIndex(want)){ flash('could not load that position'); reviewUi(); return; }
  }
  const h=histMap.get(want);
  if(!h){ reviewUi(); return; }
  ply=want;
  prefetchBack(want);          // deliberately not awaited
  draw(h.fen);
  if(h.uci&&h.uci!=='-'&&h.uci.length>=4) highlightLast(h.uci.slice(2,4)); else clearLast();
  statusEl.className='review';
  statusEl.textContent=(ply===0?'starting position'
                        :((h.uci&&h.uci!=='-'&&!h.uci.startsWith('??')) ? 'after '+h.uci : 'move '+ply))
                       +' — '+(histEnd-1-ply)+' behind the live board';
  reviewUi();
}

// quiet: leave the drawing to the caller. Used by the poll path, which is about
// to draw the newly arrived position anyway -- without it the board would be
// painted twice in one tick, the first time with the previous move's highlight,
// which reads as a flicker.
// quiet is an INTERNAL flag, and must never be reached from an event handler:
// see the wiring of #rw-live below for what happens when it is. Read as a
// strict boolean so a stray event object cannot be mistaken for one.
function goLive(quiet){
  quiet = (quiet === true);
  ply=-1;
  reviewUi();
  if(quiet) return;
  if(lastFen){ draw(lastFen); const h=histMap.get(histEnd-1);
               if(h&&h.uci!=='-'&&h.uci.length>=4) highlightLast(h.uci.slice(2,4)); }
  statusEl.className=''; statusEl.textContent='live';
  refreshStatus();
}

async function stepBack(){
  // Fetched lazily, on the first press rather than on entering the room: most
  // visits never open the review pane at all, and this is one request that
  // would otherwise be paid by every one of them.
  if(!histSynced) await syncEnd();
  if(histEnd<2){ flash('no earlier position to show'); reviewUi(); return; }
  await showPly(ply<0 ? histEnd-2 : ply-1);
}

$('rw-back').onclick=stepBack;
$('rw-fwd').onclick=()=>{ if(ply>=0&&ply<histEnd-1) showPly(ply+1); };
$('rw-first').onclick=()=>showPly(histBase);
$('rw-last').onclick=()=>showPly(histEnd-1);
// Wrapped, NOT passed directly: an onclick handler is called with the MouseEvent
// as its first argument, so `onclick=goLive` invoked goLive(event) -- and event
// is truthy, so it took the `quiet` path, which exists to SKIP the redraw for
// the poll that is about to draw the new position itself. Pressing Live
// therefore un-greyed the board and left the reviewed position sitting on it,
// so the next click sent a move read off squares the pieces were no longer on.
$('rw-live').onclick=()=>goLive();

// Arrow keys, but never while the chat box or a text field has focus -- typing
// "e4" into chat must not also rewind the board.
document.addEventListener('keydown',ev=>{
  if(!room) return;
  const t=ev.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
  if(ev.key==='ArrowLeft')  { ev.preventDefault(); stepBack(); }
  else if(ev.key==='ArrowRight'){ ev.preventDefault(); if(ply>=0&&ply<histEnd-1) showPly(ply+1); }
  else if(ev.key==='Home')  { if(ply>=0){ ev.preventDefault(); showPly(histBase); } }
  else if(ev.key==='End')   { if(ply>=0){ ev.preventDefault(); showPly(histEnd-1); } }
  else if(ev.key==='Escape'){ if(ply>=0){ ev.preventDefault(); goLive(); } }
});

// ── Game over ────────────────────────────────────────────────────────────────
// Driven off the POLLED status so both sides see it: the player delivering mate
// learns from their own reply, the one being mated only from their next poll.
const overEl=$('over');
function showGameOver(state,side){
  if(overShown===state) return;
  overShown=state;
  if(state==='resign-white'||state==='resign-black'){
    const quit=(state==='resign-white')?'White':'Black';
    $('over-title').textContent='Resignation';
    $('over-sub').textContent=quit+' resigned — '+((quit==='White')?'Black':'White')+' wins.';
  } else if(state==='draw'){
    $('over-title').textContent='Draw'; $('over-sub').textContent='Agreed by both players.';
  } else if(state==='checkmate'){
    $('over-title').textContent='Checkmate';
    $('over-sub').textContent=((side==='w')?'Black':'White')+' wins.';
  } else {
    $('over-title').textContent='Stalemate';
    $('over-sub').textContent='Draw — no legal move, and no check.';
  }
  overEl.classList.add('on');
}
function hideGameOver(){ overEl.classList.remove('on'); overShown=''; }

// Any participant may reset: the position is already dead, so there is nothing
// left to protect, and requiring a seat would strand a game whose loser closed
// their tab. Reset clears the seats, so colours are re-taken next round.
$('over-new').onclick=async()=>{
  try{
    const t=(await get(api('reset'))).trim();
    hideGameOver();
    // The server drops its history on reset, so the client must too -- a back
    // arrow that walked into the PREVIOUS game would be showing positions that
    // are not on this board's line at all.
    histMap.clear(); cacheDrop(); histBase=0; histEnd=0; ply=-1; histSynced=false;
    clearLast(); reviewUi();
    if(isFen(t)){ lastFen=t; noteLive('',t); draw(t); }
    statusEl.className=''; statusEl.textContent='new game';
    await refreshStatus(); await refreshMe();
  }catch(e){ flash('reset failed: '+e); }
};

// ── Game polling ─────────────────────────────────────────────────────────────
// Which square a move ENDED on, recovered by diffing two positions. Only needed
// for moves this client did not make -- its own go through move(), which knows
// the uci outright. A castle changes four squares and a capture changes two, so
// "the changed square that is now occupied" is ambiguous; the king is preferred
// because it is the piece that identifies a castle, and otherwise the first
// such square is taken, which is right for every ordinary move and cosmetically
// wrong at worst.
function detectLastMove(oldFen, newFen){
  const expand = f => f.split(' ')[0].split('/').join('').replace(/\d/g, d => ' '.repeat(+d)).split('');
  const o = expand(oldFen), n = expand(newFen);
  let to = -1;
  for(let i = 0; i < 64; i++){
    if(o[i] !== n[i] && n[i] !== ' '){
      if(n[i]==='K'||n[i]==='k'){ to=i; break; }
      if(to===-1) to=i;
    }
  }
  if(to<0) return '';
  return 'abcdefgh'[to%8]+(8-Math.floor(to/8));
}

async function refreshFen(){
  try{
    const f=(await get(api('fen'))).trim();
    if(!isFen(f)||f===lastFen) return;
    const prev=lastFen;
    lastFen=f;
    const to=prev?detectLastMove(prev,f):'';
    // '??'+to rather than a real uci: the FROM square is genuinely unknown here
    // and inventing one would put a wrong move in the review list. Only the
    // destination is used, and showPly reads it from slice(2,4).
    noteLive(to?('??'+to):'', f);
    // A live board follows the game; a reviewed one does not, by definition.
    // lastFen is still updated above so pressing Live lands on the CURRENT
    // position rather than on whatever was live when review started.
    // A move landing SNAPS the reviewer back to the live board. Deliberate,
    // and the opposite of leaving them where they were: while you are looking
    // at move six the game is not waiting for you, and the thing you need to
    // see the instant it happens is the move that was just played. The flash
    // is what makes the jump legible rather than jarring -- the board changes
    // and the square that caused it is already pulsing.
    if(ply>=0) goLive(true);
    draw(f);
    if(to) highlightLast(to,true);
  }catch(e){}
}

// "side state role wSeat bSeat drawoffer" -- one request tells the client
// everything it needs to render its own controls, rather than inferring role
// from a separate call that could disagree.
async function refreshStatus(){
  try{
    const p=(await get(api('status'))).trim().split(/\s+/);
    if(p.length<3){
      // Say so rather than returning silently: role is parsed here, so a quiet
      // return also freezes orientation and turn gating at whatever they were.
      flash('status unparseable: '+(p.join(' ')||'(empty)')); return;
    }
    const [side,state,role]=p, wSeat=p[3], bSeat=p[4], offer=p[5]||'none';
    myRole=role;
    myTurn=(role==='white'&&side==='w')||(role==='black'&&side==='b');

    // Orient by PRESUMPTIVE side. Seats are claimed by moving, so someone
    // joining after white has opened is reported a viewer -- correctly -- right
    // up until their own first move. Waiting for the server's answer flips the
    // board one move late, which reads as the flip being broken.
    let orient=role;
    if(role==='viewer'&&wSeat==='taken'&&bSeat==='open') orient='black';
    orientFor(orient);

    const seated=(role==='white'||role==='black');
    $('controls').style.visibility=seated?'visible':'hidden';
    if(offer==='theirs'&&seated){
      $('offer').innerHTML='draw offered — ';
      const y=document.createElement('button'); y.textContent='accept'; y.onclick=()=>verb('draw');
      const n=document.createElement('button'); n.textContent='decline'; n.onclick=()=>verb('decline');
      $('offer').append(y,' ',n); $('draw').disabled=true;
    } else {
      $('offer').textContent=(offer==='mine')?'draw offered, waiting…':'';
      $('draw').disabled=(offer==='mine');
    }

    roleEl.textContent='['+TOKEN+'] role: '+role+
      (wSeat?'  white:'+wSeat:'')+(bSeat?'  black:'+bSeat:'');
    // ply>=0 owns the status line while reviewing: it is the caption for the
    // board being shown, and "white to move" would describe a different board.
    if(statusEl.className!=='bad' && ply<0)
      statusEl.textContent=(side==='w'?'white':'black')+' to move'+(state!=='ok'?' — '+state:'');

    if(state==='checkmate'||state==='stalemate'||state==='draw'||state.startsWith('resign'))
      showGameOver(state,side);
    else if(overShown) hideGameOver();
  }catch(e){}
}

// The log carries two kinds of line now: speech, "<self>: <text>", and the
// server's own narration, marked with a leading "* ". Rendered as one element
// per line rather than as one blob of text, which is what lets narration be
// styled at all -- and textContent per line, never innerHTML, because every
// line contains client-supplied text.
//
// Compared against a REMEMBERED string rather than against the DOM: reading
// chatEl.textContent back to diff it would concatenate the lines without the
// newlines that separated them, so the comparison never matched and the pane
// was rebuilt on every single poll -- which is also what kept losing the
// selection when someone tried to copy a line.
// ── Paging ───────────────────────────────────────────────────────────────────
// A route's whole reply is one ETCS::Buffer, and TBuffer::writeString calls
// reset() BEFORE its capacity check -- so an oversized reply does not come back
// clipped, it comes back EMPTY. That is why the chat blanked the moment the log
// filled the pane: those are the same moment, and crossing the line deletes the
// response rather than shortening it.
//
// So chat and history are read in pages: "<base> <next>" then whole lines.
// base is the absolute index of the oldest line the server still holds, next
// the index to ask for after this one. Absolute indices rather than a count
// because the server's rings drop from the front, and a client reading at 40
// has to be able to tell "nothing new" from "the 40 you had are gone".
function parsePage(t){
  const nl=t.indexOf('\n');
  if(nl<0) return null;
  const m=/^(\d+) (\d+)$/.exec(t.slice(0,nl));
  if(!m) return null;
  return { base:+m[1], next:+m[2], lines:t.slice(nl+1).split('\n').filter(Boolean) };
}

let chatSeen=null, chatLines=[], chatFrom=0;

// In-flight guards. chatFrom is a CURSOR the reply advances, so two overlapping
// reads both fetch from the same index and both append what they get -- every
// line twice. tick()'s own `ticking` flag does not cover this, because the
// second caller is not a tick: sending a message pulls the log immediately so
// the sender sees their own line without waiting a beat, and that pull can land
// on top of a poll already in the air.
let chatBusy=false, histBusy=false;

function chatLine(text){
  const d=document.createElement('div');
  if(text.startsWith('* ')){ d.className='sys'; d.textContent=text.slice(2); }
  else d.textContent=text;
  return d;
}

// APPENDS when the log has only grown, and only rebuilds when it has not.
//
// Rebuilding every time was the bug: narration means the log now changes on
// every move and every arrival rather than only when somebody speaks, and a
// rebuild resets scrollTop to zero. Anyone scrolled up reading was thrown back
// to the top a second later, which made the pane unusable exactly when it had
// the most in it -- and it destroyed any in-progress text selection with it.
//
// The log is a bounded ring on the server, so once it is full the oldest line
// drops and the new log is NOT an extension of the old one. That is the case
// the prefix test catches, and the only case that still needs a full rebuild;
// scroll position is preserved across it by hand.
function renderChat(log){
  const next = log.split('\n').filter(Boolean);
  const pinned = chatEl.scrollTop + chatEl.clientHeight >= chatEl.scrollHeight - 4;

  let grown = next.length >= chatLines.length;
  if(grown) for(let i=0;i<chatLines.length;i++)
    if(chatLines[i]!==next[i]){ grown=false; break; }

  if(grown){
    for(let i=chatLines.length;i<next.length;i++) chatEl.appendChild(chatLine(next[i]));
  } else {
    const keep = chatEl.scrollTop;
    chatEl.textContent='';
    for(const l of next) chatEl.appendChild(chatLine(l));
    chatEl.scrollTop = keep;
  }

  chatLines=next; chatSeen=log;
  // Follow the tail only for a reader who was already at it. Someone scrolled
  // up has said, by scrolling up, that they are reading something else.
  if(pinned) chatEl.scrollTop=chatEl.scrollHeight;
}

function appendChat(ls){
  const pinned = chatEl.scrollTop + chatEl.clientHeight >= chatEl.scrollHeight - 4;
  for(const l of ls){ chatEl.appendChild(chatLine(l)); chatLines.push(l); }
  if(pinned) chatEl.scrollTop=chatEl.scrollHeight;
}

async function refreshChat(){
  if(chatBusy) return;
  chatBusy=true;
  try{
    // Loops rather than taking one page per poll. In the steady state that is a
    // single request -- the second finds nothing new and stops -- but a client
    // arriving at a conversation already in progress is many pages behind, and
    // one page per second would spend ten seconds visibly dribbling the
    // backlog in. Bounded so a runaway log cannot pin the connection.
    for(let round=0; round<16; round++){
      const t = await get(api('chat', String(chatFrom)));
      // An empty body is NOT an empty log. It is what an over-long reply looks
      // like on the way out, and what a dropped request looks like on the way
      // back. Either way the right move is to leave the pane alone -- blanking
      // it on a bad poll is the bug this whole path exists to fix.
      if(!t) return;

      const p = parsePage(t);
      // No header means a server that predates paging: the body is the whole
      // log, so render it wholesale. Keeps a new page working against an old
      // binary instead of showing nothing.
      if(!p){ if(t !== chatSeen) renderChat(t); return; }

      if(p.base > chatFrom){
        // The ring dropped lines this client never read. Say so rather than
        // stitching the gap invisibly -- a conversation with a silent hole in
        // it reads as a conversation that did not happen.
        chatEl.textContent=''; chatLines=[]; chatFrom=p.base;
        if(p.base>0) chatEl.appendChild(chatLine('* earlier messages dropped'));
      }
      if(p.lines.length) appendChat(p.lines);
      if(p.next<=chatFrom) break;          // nothing new, or a stuck cursor
      chatFrom = p.next;
      if(!p.lines.length) break;
    }
  } catch (e) {} finally { chatBusy=false; }
}

sayEl.addEventListener('keydown',async ev=>{
  if(ev.key!=='Enter'||!sayEl.value.trim()) return;
  const t = sayEl.value.trim().replace(/%/g, '%20');   // <--- this is the % token fix
  sayEl.value = '';
  // say answers "OK" now rather than echoing the whole log back -- that echo
  // was the single largest reply this client ever asked for. Pull the new line
  // in through the ordinary paged path instead.
  try{ await get(api('say',t)); await refreshChat(); }catch(e){}
  chatEl.scrollTop=chatEl.scrollHeight;
});

// ── Identity / record ────────────────────────────────────────────────────────
// "self W L D locked|open games idle"
async function refreshMe(){
  try{
    const p=(await get(mine('me'))).trim().split(/\s+/);
    if(p.length<5) return;
    const [, w, l, d, lk]=p;
    $('record').textContent=w+'W '+l+'L '+d+'D';
    locked=(lk==='locked');
    // The name locks on the first recorded result. Not enforcement -- there is
    // no authority here, the name is a client-supplied token -- but the client
    // honouring its own declaration, and the seed of real persistence once an
    // ACE key signs the identity instead of a cookie carrying it.
    $('rename').classList.toggle('hidden', locked);
    $('lock').textContent = locked ? '(name locked by your record)' : '';
  }catch(e){}
}
$('me').onclick=()=>leaveRoom();          // your name IS the way home
$('rename').addEventListener('change',()=>{
  const v=$('rename').value.trim();
  if(!v||/[\/\s]/.test(v)) { $('rename').value=''; return; }
  if(locked) return;
  // The seat is held by the TOKEN, so renaming mid-match abandons the old name
  // in the chair -- visible to everyone else as a seat held by a player who no
  // longer exists, for the full grace period. Leave under the old name first;
  // the next poll re-enters as the new one, and reclaims the seat by moving.
  sendLeave();
  TOKEN=v; setCookie(COOKIE,TOKEN,365); localStorage.setItem('ace_chess_token',TOKEN);
  $('rename').value=''; $('me').textContent=TOKEN; syncUrl(); tick();
});

// ── Home ─────────────────────────────────────────────────────────────────────
function stateCell(s){ return '<td class="st-'+s+'">'+s+'</td>'; }

// My games: "match opponent occupants state"
async function refreshMine(){
  let ls=[]; try{ ls=lines(await get(mine('list'))); }catch(e){ return; }
  const tb=$('mine'); tb.innerHTML='';
  $('no-mine').classList.toggle('hidden', ls.length>0);
  for(const line of ls){
    const p=line.split(/\s+/);
    if(p.length!==4){ continue; }
    const [m,opp,here,state]=p;
    const tr=document.createElement('tr');
    tr.innerHTML='<td class="key">'+m+'</td><td>'+opp+'</td><td>'+here+'/2</td>'+
                 stateCell(state)+'<td class="link">'+matchUrl(m)+'</td><td></td>';
    const b=document.createElement('button'); b.textContent='open';
    b.onclick=()=>enterRoom(m);
    tr.lastElementChild.appendChild(b); tb.appendChild(tr);
  }
}

// Every match on the node: "match occupants seats state"
async function refreshRooms(){
  let ls=[]; try{ ls=lines(await get(nodeUrl('rooms'))); }catch(e){ return; }
  const tb=$('rooms'); tb.innerHTML='';
  $('no-rooms').classList.toggle('hidden', ls.length>0);
  for(const line of ls){
    const p=line.split(/\s+/);
    // Four fields, numeric counts. Without this an error body becomes a row --
    // "404 Not Found" reads as a plausible match, hiding the actual failure.
    if(p.length!==4||!/^\d+$/.test(p[1])||!/^\d+$/.test(p[2])){
      $('no-rooms').textContent='node unreachable — server said: '+line;
      $('no-rooms').classList.remove('hidden'); tb.innerHTML=''; return;
    }
    const [m,here,seats,state]=p, full=(+here>=2);
    const tr=document.createElement('tr');
    tr.innerHTML='<td class="key">'+m+'</td><td class="'+(full?'full':'')+'">'+here+
                 '/2</td><td>'+seats+'</td>'+stateCell(state)+'<td></td>';
    const b=document.createElement('button');
    // Full matches are still enterable -- as a spectator. Arriving is free in
    // this model; only MOVING needs a seat.
    b.textContent=full?'watch':'join'; b.onclick=()=>enterRoom(m);
    tr.lastElementChild.appendChild(b); tb.appendChild(tr);
  }
}

// Every self on the node: "name W L D locked|open games idle"
async function refreshPlayers(){
  let ls=[]; try{ ls=lines(await get(nodeUrl('players'))); }catch(e){ return; }
  const tb=$('players'); tb.innerHTML='';
  $('no-players').classList.toggle('hidden', ls.length>0);
  for(const line of ls){
    const p=line.split(/\s+/);
    if(p.length<7) continue;
    const tr=document.createElement('tr');
    tr.innerHTML='<td class="'+(p[0]===TOKEN?'key':'')+'">'+p[0]+'</td><td>'+p[1]+
                 '</td><td>'+p[2]+'</td><td>'+p[3]+'</td><td>'+p[5]+'</td><td>'+p[6]+'s</td>';
    tb.appendChild(tr);
  }
}

// Fill-in pairing: the node returns a match with space, rejoining one of my own
// unfinished games first so a reload does not pair me with a stranger.
$('quick').onclick=async()=>{
  try{
    const m=(await get(mine('join'))).trim();
    if(!m||m.includes(' ')){ alert('join failed: '+m); return; }
    enterRoom(m);
  }catch(e){ alert('join failed: '+e); }
};
// Matches are created on demand, so opening one is just visiting it.
$('make').onclick=()=>{ const k=$('new-room').value.trim(); if(k&&!/[\/\s]/.test(k)) enterRoom(k); };
$('new-room').addEventListener('keydown',ev=>{ if(ev.key==='Enter') $('make').click(); });
$('refresh').onclick=tick;

// ── Views ────────────────────────────────────────────────────────────────────
function syncUrl(){
  const p=new URLSearchParams();
  if(room) p.set('room',room);
  if(qs.get('as')) p.set('as',TOKEN);
  history.replaceState(null,'',location.pathname+(p.toString()?'?'+p:''));
}
// ── Departure ────────────────────────────────────────────────────────────────
// HTTP has no disconnect signal, so the server infers presence from polling and
// releases an idle seat after thirty seconds. That grace is right for the cases
// it was built for -- a crashed tab, a closed laptop, a dropped connection --
// and wrong for the one case the client can actually see coming: someone
// deliberately leaving. Saying so turns "the seat frees up eventually" into
// "the seat is free", which is the difference between the next arrival being
// told the room is full by a player who already left and simply sitting down.
//
// keepalive rather than sendBeacon: the verb is a GET, and sendBeacon can only
// POST. keepalive is exactly the same promise -- the request outlives the
// document -- on the method this API actually speaks. Fire and forget: there is
// no page left to show an error to, and the reaper still covers the failure.
function sendLeave(){
  if(!room) return;
  const u=api('leave');
  try{ fetch(u,{keepalive:true,cache:'no-store'}).catch(()=>{}); }catch(e){}
}

function enterRoom(m){
  room=m; syncUrl();
  $('home').classList.add('hidden'); $('game').classList.remove('hidden');
  $('to-home').classList.remove('hidden'); $('here').textContent=matchUrl(m);
  lastFen=''; myRole='viewer'; myTurn=false; hideGameOver();
  // Review state belongs to a match, not to the tab: carrying one game's
  // positions into the next one would let the back arrow walk out of the game
  // being watched and into a finished one.
  histMap=new Map(); histBase=0; histEnd=0; ply=-1; histSynced=false;
  chatSeen=null; chatLines=[]; chatFrom=0; chatEl.textContent='';
  cacheLoad(m);
  clearLast(); reviewUi();
  statusEl.className=''; statusEl.textContent='joining '+m+'…';
  draw('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
  tick();
}
function leaveRoom(){
  sendLeave();                 // BEFORE room is cleared -- api() reads it
  room=null; syncUrl();
  $('game').classList.add('hidden'); $('home').classList.remove('hidden');
  $('to-home').classList.add('hidden'); $('here').textContent='';
  cacheFlush(); histMap=new Map(); histBase=0; histEnd=0; ply=-1; histSynced=false;
  cacheKey=null; boardEl.classList.remove('review');
  hideGameOver(); tick();
}
$('to-home').onclick=leaveRoom;

// pagehide, not visibilitychange: switching tabs is not leaving, and dropping a
// seat because someone looked at their email mid-game would be worse than the
// problem this fixes. pagehide covers the close, the reload and the navigation
// away, which are the departures the client can be sure of.
window.addEventListener('pagehide',()=>{ cacheFlush(); sendLeave(); });

// One timer dispatching on the current view. Home polls at half rate: it is four
// requests, none of them urgent, and none of them heartbeat a match -- listing
// is read-only, so browsing costs nobody a seat.
let beat=0;
let ticking=false;

// AWAITED, not fired in parallel. Three concurrent fetches meant three
// concurrent TCP connections per tab; awaited, keep-alive reuses ONE. The
// server closing per request was filling the client's ephemeral port range
// with TIME-WAIT (60s each) until connect() stalled waiting for one to expire
// -- which looked exactly like a server hang, with the server idle and its
// accept backlog empty.
//
// ticking guards re-entry: a slow tick must not stack a second set of requests
// on top of itself, which is how a transient stall used to become permanent.
async function tick(){
  if(ticking) return;
  ticking=true;
  try{
    $('me').textContent=TOKEN;
    if(room){
      await refreshFen(); await refreshStatus(); await refreshChat();
      if(beat%3===0) await refreshMe();
    }
    else if(beat%2===0){
      await refreshMe(); await refreshMine(); await refreshRooms(); await refreshPlayers();
    }
    beat++;
  } finally { ticking=false; }
}

// A hidden tab needs no board. Browsers already throttle timers in background
// tabs, but they do not stop them, and a left-open tab polling for hours is
// most of the churn in a long test run.
function scheduleTick(){
  if(!document.hidden) tick();
}
if (room) enterRoom(room);
else tick();
setInterval(scheduleTick,1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tick(); });
</script>
